</head>
<body>
<div class="container">
    <h1>AI查重助手<span class="version-badge">v1.0</span></h1>
    <div class="comparison-card">
        <div class="card-header"><label>新品ID：</label><input type="text" id="newProductId" placeholder="如 2424704"></div>
        <div class="card-content">
            <div class="config-bar">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="highlight-label">已建数量：</span>
                    <select id="builtCount"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
                    <span class="blue-hint">🔹 可调整对比数量</span>
                </div>
            </div>
            <div class="compare-layout">
                <div class="unbuilt-area">
                    <div class="zone-header"><h3>📦 未建</h3></div>
                    <textarea placeholder="输入产品方案" class="text-area" id="unbuiltText"></textarea>
                    <div class="price-input"><label>💰 价格 (美元)</label><input type="number" step="0.01" id="unbuiltPrice" placeholder="如 19.99（选填）"></div>
                    <div class="dropzone" id="unbuiltDropzone">
                        <img id="unbuiltPreview" class="preview-img">
                        <div class="instructions" id="unbuiltInstructions">拖拽图片到此 或 Ctrl+V 粘贴<br><span class="upload-link" id="unbuiltUploadBtn">点击上传</span></div>
                        <button class="delete-img-btn" id="unbuiltDeleteBtn" style="display:none;">✕</button>
                        <input type="file" accept="image/*" id="unbuiltFileInput" style="display:none">
                    </div>
                </div>
                <div class="built-area" id="builtArea"></div>
            </div>
            <button class="compare-btn" id="compareBtn">🔍 启动AI对比分析</button>
        </div>
    </div>
    <div class="qa-section">
        <div class="qa-header">💬 AI智能问答</div>
        <div class="qa-body">
            <div class="qa-input-group"><input type="text" id="qaQuestion" placeholder="输入您的问题，例如：炻器是否属于陶瓷材质？"><button id="qaAskBtn">提问</button></div>
            <div id="qaAnswer" class="qa-answer" style="display:none;"></div>
        </div>
    </div>
    <div class="history-section">
        <div class="history-header">
            <span>📋 查重记录</span>
            <div class="search-box">
                <input type="text" id="historySearchInput" placeholder="按新品ID搜索">
                <button id="historySearchBtn">搜索</button>
                <button id="historyResetBtn">重置</button>
                <button class="clear-history" id="clearHistoryBtn">清空记录</button>
            </div>
        </div>
        <div id="recordsList" class="records-list"></div>
    </div>
</div>
<script>
(function(){
    "use strict";

    // ---------- API 配置 ----------
    const DOUBAO_API_KEY = "fbcfcc90-d805-42a1-9424-f983f423c09a";
    const DOUBAO_ENDPOINT_ID = "ep-20260320164842-rsqff";
    const DOUBAO_URL = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";

    const DB_NAME = "AIChatHistoryDB", DB_VERSION = 2, STORE_NAME = "records";
    let historyRecords = [], db = null;

    // ---------- IndexedDB 操作 ----------
    function openDB() { return new Promise((resolve, reject) => { if (db && db.name === DB_NAME) { resolve(db); return; } const r = indexedDB.open(DB_NAME, DB_VERSION); r.onerror = e => reject(e.target.error); r.onsuccess = e => { db = e.target.result; resolve(db); }; r.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "id" }); }; }); }
    async function loadHistory() { try { const database = await openDB(); const tx = database.transaction(STORE_NAME, "readonly"); const store = tx.objectStore(STORE_NAME); const req = store.getAll(); const rec = await new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); rec.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); historyRecords = rec; renderRecordsList(); } catch (e) { console.error(e); historyRecords = []; renderRecordsList(); } }
    async function saveHistory() { try { const database = await openDB(); const tx = database.transaction(STORE_NAME, "readwrite"); const store = tx.objectStore(STORE_NAME); await new Promise((res, rej) => { const cr = store.clear(); cr.onsuccess = () => res(); cr.onerror = () => rej(cr.error); }); for (const r of historyRecords) store.add(r); await new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); } catch (e) { console.error(e); } }
    async function addRecord(r) { historyRecords.unshift(r); await saveHistory(); renderRecordsList(); }
    async function updateRecord(id, upd) { const idx = historyRecords.findIndex(r => r.id === id); if (idx !== -1) { historyRecords[idx] = { ...historyRecords[idx], ...upd }; await saveHistory(); renderRecordsList(); } }
    async function clearHistory() { historyRecords = []; await saveHistory(); renderRecordsList(); }

    // ---------- 辅助函数 ----------
    function safeString(s) { return typeof s === 'string' ? s : ''; }
    function formatPercent(v) { if (v === null || v === undefined) return '—'; if (v > 100) return '100%+'; return Math.round(v) + '%'; }
    
    // 强化总数提取：优先“X款共Y个”等表述
    function extractPrimaryQuantity(text) {
        const s = safeString(text);
        if (!s) return null;
        let m = s.match(/\d+\s*(?:款|件|个|套|包|盒|箱|组)\s*[共总计合计一共总共]+\s*(\d+)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|卷)/i);
        if (m) return parseFloat(m[1]);
        m = s.match(/(?:共|总计|合计|一共|总共)\s*(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|卷|款|种|类)/i);
        if (m) return parseFloat(m[1]);
        m = s.match(/(?:共|总计|合计|一共|总共)?\s*(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|卷|款|种|类)\s*(?:打包|一套|一组|一盒|一包|一箱|装|组合)/i);
        if (m) return parseFloat(m[1]);
        m = s.match(/(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|卷|款|种|类)\s*(?:，|。|$)/);
        if (m) return parseFloat(m[1]);
        m = s.match(/(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|卷|款|种|类)/);
        if (m) return parseFloat(m[1]);
        m = s.match(/[：:]\s*(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|卷|款|种|类)/);
        if (m) return parseFloat(m[1]);
        return null;
    }
    
    function extractUnit(text) {
        const s = safeString(text);
        const match = s.match(/(?:共|总计|合计|一共|总共)?\s*\d+(?:\.\d+)?\s*([件个张条把套片包支枝束只卷款种类]+)/i);
        if (match) return match[1];
        return null;
    }
    
    function convertToCm(input) {
        if (input === null || input === undefined) return null;
        if (typeof input === 'number') return input;
        let str = String(input).trim();
        if (!str) return null;
        let m = str.match(/^([\d.]+)\s*(?:''|″|英寸|inch|in)\b/i);
        if (m) return parseFloat(m[1]) * 2.54;
        m = str.match(/^([\d.]+)\s*(?:'|′|英尺|ft|foot)\b/i);
        if (m) return parseFloat(m[1]) * 30.48;
        m = str.match(/^([\d.]+)\s*(?:cm|厘米)\b/i);
        if (m) return parseFloat(m[1]);
        m = str.match(/^([\d.]+)\s*(?:mm|毫米)\b/i);
        if (m) return parseFloat(m[1]) / 10;
        m = str.match(/^([\d.]+)\s*(?:m|米)\b/i);
        if (m) return parseFloat(m[1]) * 100;
        m = str.match(/^([\d.]+)$/);
        if (m) return parseFloat(m[1]);
        return null;
    }
    
    const dimensionMap = {
        'length': 'length', 'long': 'length', '长': 'length',
        'width': 'width', 'wide': 'width', '宽': 'width',
        'height': 'height', 'high': 'height', '高': 'height',
        'diameter': 'diameter', 'dia': 'diameter', '直径': 'diameter'
    };
    
    function calcSizeDiffStructured(bObj, uObj) {
        if (!bObj || !uObj) return { diff: null, reason: '未识别', details: [], weightedDetails: [] };
        const normBuilt = {}, normUnbuilt = {};
        const bUnit = (bObj.unit || bObj.单位 || '').toLowerCase();
        const uUnit = (uObj.unit || uObj.单位 || '').toLowerCase();
        const inchUnits = ['inch', 'inches', 'in', '英寸', '寸'];
        const bIsInch = inchUnits.some(u => bUnit.includes(u));
        const uIsInch = inchUnits.some(u => uUnit.includes(u));
        const bConvert = bIsInch ? 2.54 : 1;
        const uConvert = uIsInch ? 2.54 : 1;
        
        for (let key in bObj) {
            const normKey = dimensionMap[key.toLowerCase()] || key;
            if (normKey === 'unit' || normKey === '单位') continue;
            let val = bObj[key];
            if (typeof val === 'number') val *= bConvert;
            else if (typeof val === 'string') { const cm = convertToCm(val); val = (cm !== null) ? cm : null; }
            if (val !== null && val > 0) normBuilt[normKey] = val;
        }
        for (let key in uObj) {
            const normKey = dimensionMap[key.toLowerCase()] || key;
            if (normKey === 'unit' || normKey === '单位') continue;
            let val = uObj[key];
            if (typeof val === 'number') val *= uConvert;
            else if (typeof val === 'string') { const cm = convertToCm(val); val = (cm !== null) ? cm : null; }
            if (val !== null && val > 0) normUnbuilt[normKey] = val;
        }
        const builtKeys = Object.keys(normBuilt), unbuiltKeys = Object.keys(normUnbuilt);
        if (builtKeys.length === 1 && unbuiltKeys.length > 1) {
            const singleKey = builtKeys[0];
            const bestKey = unbuiltKeys.find(k => k === singleKey) || unbuiltKeys.find(k => k.includes(singleKey) || singleKey.includes(k)) || (unbuiltKeys.includes('length') ? 'length' : unbuiltKeys[0]);
            normUnbuilt = { [bestKey]: normUnbuilt[bestKey] };
        }
        if (unbuiltKeys.length === 1 && builtKeys.length > 1) {
            const singleKey = unbuiltKeys[0];
            const bestKey = builtKeys.find(k => k === singleKey) || builtKeys.find(k => k.includes(singleKey) || singleKey.includes(k)) || (builtKeys.includes('length') ? 'length' : builtKeys[0]);

            if (skipQ && qDiff >= 100) qDisp = '<div>数量差异 = 数量差异过大，可能识别错误，不参与计算</div>';
            else if (qDiff !== null && !isNaN(qDiff)) {
                const refSuffix = isReferenceQ ? '（参考数值）' : '';
                qDisp = `<div>数量差异 = |${qtyUnbuilt} - ${qtyBuilt}| / ${qtyBuilt} × 100% = ${formatPercent(qDiff)}${refSuffix}${usePrimaryQty ? ` (主产品数量: 未建${qtyUnbuilt} / 已建${qtyBuilt})` : ''}</div>`;
            } else qDisp = '<div>数量差异 = 数据缺失</div>';
            let schemeSubValue = '';
            if (isReferenceQ) schemeSubValue = '数量差(参考)不计 + 尺寸差不计';
            else schemeSubValue = `数量差 ${qDiff !== null ? formatPercent(qDiff) : '—'} + 尺寸差 ${sizeDiff !== null ? formatPercent(sizeDiff) : '—'}`;
            const imagesHtml = `<div class="product-images-compare"><div class="product-image-box"><img src="${unbuiltImg}" alt="未建产品图"><p>📦 未建产品</p></div><div class="product-image-box"><img src="${b.imageData}" alt="已建产品图"><p>🏷️ 已建产品</p></div></div>`;
            const funcHtml = `<div class="diff-item"><div class="diff-label">核心功能与用途</div><div class="diff-desc"><span class="summary-badge">${res.function_usage_summary ? res.function_usage_summary.split('。')[0] : '分析中'}</span>${(!res.function_usage_summary || !res.function_usage_summary.includes('一致')) ? `<br><strong>未建：</strong> ${res.unbuilt_function_usage || '—'}<br><strong>已建：</strong> ${res.built_function_usage || '—'}` : ''}</div></div>`;
            const sceneHtml = `<div class="diff-item"><div class="diff-label">使用人群与场景</div><div class="diff-desc"><span class="summary-badge">${res.scene_audience_summary ? res.scene_audience_summary.split('。')[0] : '分析中'}</span>${(!res.scene_audience_summary || !res.scene_audience_summary.includes('一致')) ? `<br><strong>未建：</strong> ${res.unbuilt_scene_audience || '—'}<br><strong>已建：</strong> ${res.built_scene_audience || '—'}` : ''}</div></div>`;
            const compHtml = `<div class="diff-item"><div class="diff-label">🏆 上架竞争程度分析</div><div class="diff-desc"><div class="competition-level-box"><div class="label">判定等级</div><div>${compLevel}</div></div><div class="competition-analysis-text"><strong>详细分析：</strong><br>${(res.competition_analysis || '无详细分析').replace(/\n/g, '<br>')}</div>${res.submarket_difference_analysis ? `<div class="submarket-box"><div class="label">细分市场差异分析</div><div class="content">${res.submarket_difference_analysis.replace(/\n/g, '<br>')}</div></div>` : ''}</div></div>`;
            const pioneerHtml = isPio ? `<div class="diff-item"><div class="diff-label">📋 首创规则判定</div><div class="diff-desc">${passReason}</div></div>` : '';
            allHtml += `<div style="margin-bottom:20px; border:1px solid #e2e8f0; border-radius:16px; padding:12px;"><h4 style="margin-bottom:12px;">📊 对比已建 ${i+1}</h4>${imagesHtml}<div class="product-descriptions"><div class="product-card"><h4>📦 未建</h4><div class="product-desc-text">${res.unbuilt_product_desc || '—'}${uAttr.length ? `<div class="attr">${uAttr.join(' · ')}</div>` : ''}${duplicateNoteHtml}</div></div><div class="product-card"><h4>🏷️ 已建</h4><div class="product-desc-text">${res.built_product_desc || '—'}${bAttr.length ? `<div class="attr">${bAttr.join(' · ')}</div>` : ''}</div></div></div><div class="dimension-summary"><div class="dimension-card"><h4>📊 方案差异度</h4><div class="dimension-value">${isReferenceQ ? '—' : (schemeRounded !== null ? formatPercent(schemeRounded) : (sizeReason === '微小' ? '微小' : '—'))}</div><div class="sub-value">${schemeSubValue}</div></div><div class="dimension-card"><h4>🎨 图案差异度</h4><div class="dimension-value">${formatPercent(appearDiff)}</div><div class="sub-value">豆包AI视觉分析</div></div><div class="dimension-card"><h4>⚖️ 综合差异度</h4><div class="dimension-value">${formatPercent(combinedRounded)}</div><div class="sub-value">${!isReferenceQ && !skipSizeDiff ? '数量差 + 尺寸差 + 图案差' : (isReferenceQ ? '数量差(参考)不计 + 尺寸差不计 + 图案差' : (skipSizeDiff ? '尺寸差不计 + 图案差' : '数量差 + 尺寸差 + 图案差'))}</div></div></div><div class="formula-area"><div><strong>📐 计算过程：</strong></div>${qDisp}${sizeDisp}<div>图案差异 = ${formatPercent(appearDiff)} (豆包AI)</div><div>综合差异 = ${formatPercent(combinedRounded)}</div></div><div class="diff-detail">${funcHtml} ${sceneHtml}<div class="diff-item"><div class="diff-label">整体目视化差异</div><div class="diff-desc">${res.visual_overall || '—'}</div></div><div class="diff-item"><div class="diff-label">形状与轮廓</div><div class="diff-desc">${res.shape_contour || '—'}</div></div><div class="diff-item"><div class="diff-label">图案与装饰</div><div class="diff-desc">${res.pattern_decoration || '—'}</div></div><div class="diff-item"><div class="diff-label">结构与部件</div><div class="diff-desc">${res.structure_parts || '—'}</div></div><div class="diff-item"><div class="diff-label">📌 总结性分析</div><div class="diff-desc">${res.summary || '—'}</div></div>${pioneerHtml}${compHtml}</div><div class="final-conclusion"><div class="conclusion-text ${isPass ? 'pass' : 'fail'}">${isPass ? '通过' : '不通过'}</div>${!isPass && passReason ? `<div style="font-size:12px;color:#6b7280;">${passReason}</div>` : (isPass && passReason ? `<div style="font-size:12px;color:#15803d;">${passReason}</div>` : '')}</div></div>`;
        }
        const finalPass = overallPass, shortDesc = cachedUnbuilt?.short_desc || '无';
        let statsHtml = ''; if (pioneerFail) statsHtml = `<div class="summary-stats" style="display:flex;gap:16px;"><div class="stat"><span class="stat-value">❌ 不通过</span></div><div class="stat"><span class="stat-value">与首创款式差异不足</span></div></div>`;
        else { let passExtra = ''; if (finalCompLevel === '较低竞争' || finalCompLevel === '无竞争') passExtra = `（竞争程度${finalCompLevel}，不构成直接竞争）`; statsHtml = `<div class="summary-stats" style="display:flex;gap:16px;"><div class="stat"><span class="stat-value">${finalPass ? '✅ 通过' : '❌ 不通过'}</span></div><div class="stat">${finalPass ? `<span class="stat-value">${formatPercent(finalMin)}</span><span class="stat-label">最小综合差异</span>` : `<span class="stat-value">${formatPercent(finalMin)}</span><span class="stat-label">最小综合差异</span>`}</div></div>${finalPass && passExtra ? `<div style="font-size:12px;color:#15803d;">${passExtra}</div>` : ''}`; }
        const summaryHtml = `<div class="record-summary"><div class="record-info"><div class="image-row"><div class="thumb"><img src="${cfg.unbuiltThumb}"></div><span class="vs">VS</span>${cfg.builtThumbs.map(t => `<div class="thumb"><img src="${t}"></div>`).join('')}</div><div class="record-desc">新品ID: ${cfg.newProductId||'未填'}<br>产品名称: ${shortDesc}</div></div><div class="price-display">💰 未建: ${uPriceDisp} &nbsp;|&nbsp; 已建: ${bPricesDisp}</div>${statsHtml}<span class="toggle-icon">▼</span></div><div class="record-detail" style="display:none;">${allHtml}</div>`;
        return { summaryHtml, detailHtml: allHtml, isPass: finalPass, combinedDiff: finalMin, productName: shortDesc };
    }

    async function retryAnalysis(rec) { if (!rec || (rec.status !== 'failed' && rec.status !== 'done')) return; await updateRecord(rec.id, { status: 'analyzing', summaryHtml: '', detailHtml: '', isPass: false, combinedDiff: 0, productName: '' }); try { const builtCfg = rec.builtConfigs.map((c, idx) => ({ imageData: rec.builtImagesData?.[idx] || null, text: c.text, price: c.price, compareType: c.compareType, buildDate: c.buildDate, productType: c.productType })).filter(b => b.imageData); if (!rec.unbuiltImageData) throw new Error('缺少未建原图'); const cfg = { unbuiltImageData: rec.unbuiltImageData, unbuiltText: rec.unbuiltDesc, unbuiltPrice: rec.unbuiltPrice, newProductId: rec.newProductId, unbuiltThumb: rec.unbuiltThumb, builtThumbs: rec.builtThumbs, builtItemsData: builtCfg }; const r = await analyzeWithConfig(cfg); await updateRecord(rec.id, { status: 'done', summaryHtml: r.summaryHtml, detailHtml: r.detailHtml, isPass: r.isPass, combinedDiff: r.combinedDiff, productName: r.productName }); } catch (e) { console.error(e); await updateRecord(rec.id, { status: 'failed', summaryHtml: `<div class="record-summary">分析失败: ${e.message}</div>`, detailHtml: '', isPass: false, combinedDiff: 0, productName: '分析失败' }); } }

    function renderRecordsList(searchTerm = '') { let expandedId = null; const exist = document.querySelector('.record-detail[style*="display: block"]'); if (exist) { const item = exist.closest('.record-item'); if (item) expandedId = item.getAttribute('data-id'); } const cont = document.getElementById('recordsList'); if (!cont) return; let filtered = [...historyRecords]; if (searchTerm.trim()) { const t = searchTerm.trim().toLowerCase(); filtered = filtered.filter(r => r.newProductId && r.newProductId.toLowerCase().includes(t)); } if (filtered.length === 0) { cont.innerHTML = '<p style="text-align:center;color:#64748b;">暂无记录</p>'; return; } let html = ''; filtered.forEach(rec => { const statText = rec.status === 'analyzing' ? 'AI分析中...' : (rec.isPass ? '通过' : '不通过'); const statClass = rec.status === 'analyzing' ? 'analyzing' : (rec.isPass ? 'pass' : 'fail'); const uPriceDisp = rec.unbuiltPrice ? `$${parseFloat(rec.unbuiltPrice).toFixed(2)}` : '未填'; const bPricesDisp = (rec.builtConfigs || []).map(c => c.price ? `$${parseFloat(c.price).toFixed(2)}` : '未填').join(', '); if (rec.summaryHtml) html += `<div class="record-item" data-id="${rec.id}">${rec.summaryHtml}${rec.status === 'failed' ? `<div style="text-align:right;"><button class="retry-btn" data-id="${rec.id}">重新分析</button></div>` : ''}</div>`; else { const prodName = rec.productName || (rec.status === 'analyzing' ? '分析中...' : (rec.isPass ? '通过' : '不通过')); html += `<div class="record-item" data-id="${rec.id}"><div class="record-summary"><div class="record-info"><div class="image-row"><div class="thumb"><img src="${rec.unbuiltThumb || ''}"></div><span class="vs">VS</span>${(rec.builtThumbs || []).map(t => `<div class="thumb"><img src="${t}"></div>`).join('')}</div><div class="record-desc">新品ID: ${rec.newProductId || '未填'}<br>产品名称: ${prodName}</div></div><div class="price-display">💰 未建: ${uPriceDisp} &nbsp;|&nbsp; 已建: ${bPricesDisp}</div><div class="record-status ${statClass}">${statText}</div>${rec.status === 'failed' ? `<button class="retry-btn" data-id="${rec.id}">重新分析</button>` : ''}<span class="toggle-icon">▼</span></div><div class="record-detail" style="display:none;"></div></div>`; } }); cont.innerHTML = html; cont.querySelectorAll('.record-item').forEach(item => { const sum = item.querySelector('.record-summary'), det = item.querySelector('.record-detail'); if (sum && det) sum.addEventListener('click', e => { if (e.target.classList.contains('retry-btn')) return; const hidden = det.style.display === 'none'; det.style.display = hidden ? 'block' : 'none'; sum.querySelector('.toggle-icon').textContent = hidden ? '▲' : '▼'; }); const retry = item.querySelector('.retry-btn'); if (retry) retry.addEventListener('click', async e => { e.stopPropagation(); const id = retry.dataset.id; const rec = historyRecords.find(r => r.id === id); if (rec) await retryAnalysis(rec); }); }); if (expandedId) { const tgt = cont.querySelector(`.record-item[data-id="${expandedId}"]`); if (tgt) { const det = tgt.querySelector('.record-detail'), sum = tgt.querySelector('.record-summary'); if (det && sum && det.style.display !== 'block') { det.style.display = 'block'; sum.querySelector('.toggle-icon').textContent = '▲'; } } } }

    // ---------- 启动 ----------
    initUnbuilt(); for (let i = 1; i <= 1; i++) builtItems[`built_${i}`] = { imageDataUrl: null, compressedBase64: null, text: '', price: '', compareType: 'non_pioneer', buildDate: '', productType: 'regular' }; rebuildBuiltItems(1);
    builtCountSelect.addEventListener('change', () => { rebuildBuiltItems(parseInt(builtCountSelect.value)); });
    document.getElementById('compareBtn').onclick = async function() { if (!unbuilt.imageDataUrl) { alert('请上传未建产品图片'); return; } const anyBuilt = Object.keys(builtItems).some(k => builtItems[k].imageDataUrl); if (!anyBuilt) { alert('请至少上传一个已建图片'); return; } const uImg = unbuilt.imageDataUrl, uTxt = unbuilt.text, uPrice = unbuilt.price, uThumb = unbuilt.compressedBase64 || '', newId = unbuilt.newProductId; const builtData = Object.keys(builtItems).map(k => ({ imageData: builtItems[k].imageDataUrl, text: builtItems[k].text, price: builtItems[k].price, compareType: builtItems[k].compareType, buildDate: builtItems[k].buildDate, productType: builtItems[k].productType })); const bThumbs = Object.keys(builtItems).map(k => builtItems[k].compressedBase64 || ''); clearComparisonGroup(); const recId = Date.now() + '_' + Math.random(); const tmp = { id: recId, newProductId: newId, timestamp: new Date().toLocaleString(), status: 'analyzing', summaryHtml: '', detailHtml: '', isPass: false, combinedDiff: 0, unbuiltThumb: uThumb, builtThumbs: bThumbs, unbuiltDesc: uTxt, unbuiltPrice: uPrice, builtConfigs: builtData.map(b => ({ text: b.text, price: b.price, compareType: b.compareType, buildDate: b.buildDate, productType: b.productType })), productName: '', unbuiltImageData: uImg, builtImagesData: builtData.map(b => b.imageData) }; await addRecord(tmp); (async () => { try { const cfg = { unbuiltImageData: uImg, unbuiltText: uTxt, unbuiltPrice: uPrice, newProductId: newId, unbuiltThumb: uThumb, builtThumbs: bThumbs, builtItemsData: builtData }; const r = await analyzeWithConfig(cfg); await updateRecord(recId, { status: 'done', summaryHtml: r.summaryHtml, detailHtml: r.detailHtml, isPass: r.isPass, combinedDiff: r.combinedDiff, productName: r.productName }); } catch (e) { console.error(e); await updateRecord(recId, { status: 'failed', summaryHtml: `<div class="record-summary">分析失败: ${e.message}</div>`, detailHtml: '', isPass: false, combinedDiff: 0, productName: '分析失败' }); } })(); };
    const searchInp = document.getElementById('historySearchInput'), searchBtn = document.getElementById('historySearchBtn'), resetBtn = document.getElementById('historyResetBtn'), clearBtn = document.getElementById('clearHistoryBtn');
    searchBtn.addEventListener('click', () => renderRecordsList(searchInp.value)); resetBtn.addEventListener('click', () => { searchInp.value = ''; renderRecordsList(''); }); clearBtn.addEventListener('click', async () => { if (confirm('确定清空所有记录？')) await clearHistory(); }); searchInp.addEventListener('keypress', e => { if (e.key === 'Enter') renderRecordsList(searchInp.value); });
    const qaBtn = document.getElementById('qaAskBtn'), qaQ = document.getElementById('qaQuestion'), qaA = document.getElementById('qaAnswer');
    qaBtn.addEventListener('click', async () => { const q = qaQ.value.trim(); if (!q) { alert('请输入问题'); return; } qaA.style.display = 'block'; qaA.innerHTML = '🤔 思考中...'; qaA.classList.add('loading'); try { const a = await askQuestion(q); qaA.innerHTML = a; qaA.classList.remove('loading'); } catch (e) { qaA.innerHTML = `❌ 回答失败：${e.message}`; qaA.classList.remove('loading'); } }); qaQ.addEventListener('keypress', e => { if (e.key === 'Enter') qaBtn.click(); });
    loadHistory().catch(console.error);
})();
</script>
