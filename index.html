        if (totalAfterStyle) return parseFloat(totalAfterStyle[1]);
        const eachThenTotal = s.match(new RegExp(`\\d+(?:\\.\\d+)?\\s*(?:款|种)(?:图案|款式)?[，,、\\s]*(?:每\\s*)?(?:款|种|款式)?(?:各|分别|每)?\\s*\\d+(?:\\.\\d+)?\\s*${QUANTITY_UNIT_PATTERN}[，,、\\s]*(?:共|总计|合计|一共|总共)\\s*(\\d+(?:\\.\\d+)?)\\s*${QUANTITY_UNIT_PATTERN}`));
        if (eachThenTotal) return parseFloat(eachThenTotal[1]);
        const perStyle = s.match(new RegExp(`(?:共\\s*)?(\\d+(?:\\.\\d+)?)\\s*(?:款|种)(?:图案|款式)?[，,、\\s]*(?:每\\s*)?(?:款|种|款式)?(?:各|分别|每)?\\s*(\\d+(?:\\.\\d+)?)\\s*(${QUANTITY_UNIT_PATTERN})`));
        if (perStyle) return parseFloat(perStyle[1]) * parseFloat(perStyle[2]);
        const styleEach = s.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(?:款|种)(?:图案|款式)?[，,、\\s]*(?:每\\s*)?(?:款|种|款式)?(?:各|分别|每)?\\s*(\\d+(?:\\.\\d+)?)\\s*(${QUANTITY_UNIT_PATTERN})`));
        if (styleEach) return parseFloat(styleEach[1]) * parseFloat(styleEach[2]);
        let pack = s.match(new RegExp(`(?:一包|每包|一盒|每盒|一捆|每捆|一组|每组|一套|每套|包装|装)\\s*(\\d+(?:\\.\\d+)?)\\s*(${QUANTITY_UNIT_PATTERN})`, 'i'));
        if (pack) return parseFloat(pack[1]);
        pack = s.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${QUANTITY_UNIT_PATTERN})\\s*(?:一包|每包|一盒|每盒|一捆|每捆|一组|每组|一套|每套|包装|装)`, 'i'));
        if (pack) return parseFloat(pack[1]);
        let m = s.match(/\d+\s*(?:款|件|个|套|包|盒|箱|种)\s*(?:共|总计|合计|一共|总共)\s*(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|双|副|卷|款|种)/i);
        if (m) return parseFloat(m[1]);
        m = s.match(/(?:共|总计|合计|一共|总共)\s*(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|双|副|卷|款|种)/i);
        if (m) return parseFloat(m[1]);
        m = s.match(/(?:共|总计|合计|一共|总共)?\s*(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|双|副|卷|款|种)\s*(?:打包|一套|一组|一盒|一包|一箱|装|组合)/i);
        if (m) return parseFloat(m[1]);
        m = s.match(/(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|双|副|卷|款|种)\s*(?:，|。|$)/);
        if (m) return parseFloat(m[1]);
        m = s.match(/(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|双|副|卷|款|种)/);
        if (m) return parseFloat(m[1]);
        m = s.match(/[：:]\s*(\d+(?:\.\d+)?)\s*(?:件|个|张|条|把|套|片|包|支|枝|束|只|双|副|卷|款|种)/);
        if (m) return parseFloat(m[1]);
        const generalMatches = [...s.matchAll(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${QUANTITY_UNIT_PATTERN})(?=\\s|$|[^\\d])`, 'gi'))];
        if (generalMatches.length) return parseFloat(generalMatches[generalMatches.length - 1][1]);
        return null;
    }
    
    function extractUnit(text) {
        let s = stripInternalGridCounts(text);
        const countPerSet = s.match(new RegExp(`\\d+(?:\\.\\d+)?\\s*(${QUANTITY_UNIT_PATTERN})\\s*(?:组成|合为|为|装为)?\\s*(?:1|一)\\s*(?:套|组)(?=[，,；;。】）)\\]\\s]|$)`, 'i'));
        if (countPerSet) return countPerSet[1];
        const setPack = s.match(/\d+(?:\.\d+)?\s*(件|个|只|颗|条|张|片|双|副)\s*(?:装|套装|一套|套)/);
        if (setPack) return setPack[1];
        const perStyle = s.match(new RegExp(`(?:共\\s*)?\\d+(?:\\.\\d+)?\\s*(?:款|种)(?:图案|款式)?[，,、\\s]*(?:每\\s*)?(?:款|种|款式)?(?:各|分别|每)?\\s*\\d+(?:\\.\\d+)?\\s*(${QUANTITY_UNIT_PATTERN})`));
        if (perStyle) return perStyle[1];
        let pack = s.match(new RegExp(`(?:一包|每包|一盒|每盒|一捆|每捆|一组|每组|一套|每套|包装|装)\\s*\\d+(?:\\.\\d+)?\\s*(${QUANTITY_UNIT_PATTERN})`, 'i'));
        if (pack) return pack[1];
        pack = s.match(new RegExp(`\\d+(?:\\.\\d+)?\\s*(${QUANTITY_UNIT_PATTERN})\\s*(?:一包|每包|一盒|每盒|一捆|每捆|一组|每组|一套|每套|包装|装)`, 'i'));
        if (pack) return pack[1];
        const match = s.match(/(?:共|总计|合计|一共|总共)?\s*\d+(?:\.\d+)?\s*([件个张条把套片包支枝束只双副卷款种类]+)/i);
        if (match) return match[1];
        const generalMatches = [...s.matchAll(new RegExp(`\\d+(?:\\.\\d+)?\\s*(${QUANTITY_UNIT_PATTERN})(?=\\s|$|[^\\d])`, 'gi'))];
        if (generalMatches.length) return generalMatches[generalMatches.length - 1][1];
        return null;
    }

    function parseQuantityValue(value) {
        if (value === null || value === undefined) return 0;
        if (typeof value === 'number') return value;
        const text = safeString(value).replace(/,/g, '');
        const match = text.match(/(\d+(?:\.\d+)?)/);
        return match ? parseFloat(match[1]) : 0;
    }

    function displayPercentValue(value) {
        const num = Number(value);
        if (!isFinite(num)) return '—';
        return num > 100 ? '100%+' : `${Math.round(num)}%`;
    }

    function parseManualSizeInput(text, unitOverride = '') {
        const raw = safeString(text).trim();
        if (!raw) return null;
        const normalized = raw.replace(/[×＊*X]/g, 'x').replace(/厘米/g, 'cm').replace(/公分/g, 'cm').replace(/英寸/g, 'in').replace(/英尺/g, 'ft').replace(/码/g, 'yd').replace(/千克|公斤/g, 'kg').replace(/克/g, 'g').replace(/毫升/g, 'ml').replace(/升/g, 'L');
        const nums = [...normalized.matchAll(/(\d+(?:\.\d+)?)/g)].map(m => parseFloat(m[1])).filter(v => isFinite(v) && v > 0);
        if (!nums.length) return null;
        const unitMatch = normalized.match(/(kg|g|ml|l|cm|mm|m|yd|ft|inch|inches|in|["″])/i);
        let unit = (unitOverride || (unitMatch ? unitMatch[1] : 'cm')).toLowerCase();
        if (unit === '厘米' || unit === '公分') unit = 'cm';
        if (unit === '毫米') unit = 'mm';
        if (unit === '米') unit = 'm';
        if (unit === '英寸' || unit === '"' || unit === '″' || unit === 'inch' || unit === 'inches') unit = 'in';
        if (unit === '英尺') unit = 'ft';
        if (unit === '码') unit = 'yd';
        if (unit === '千克' || unit === '公斤') unit = 'kg';
        if (unit === '克') unit = 'g';
        if (unit === '毫升') unit = 'ml';
        if (unit === '升') unit = 'l';
        if (unit === 'mm') nums.forEach((v, i) => nums[i] = v / 10);
        if (unit === 'm') nums.forEach((v, i) => nums[i] = v * 100);
        if (unit === 'ft') nums.forEach((v, i) => nums[i] = v * 30.48);
        if (unit === 'yd') nums.forEach((v, i) => nums[i] = v * 91.44);
        if (unit === 'kg') nums.forEach((v, i) => nums[i] = v * 1000);
        if (unit === 'l') nums.forEach((v, i) => nums[i] = v * 1000);
        if (unit === 'mm' || unit === 'm' || unit === 'ft' || unit === 'yd') unit = 'cm';
        if (unit === 'kg') unit = 'g';
        if (unit === 'l') unit = 'ml';
        const obj = { unit };
        if (/直径|diameter|dia/i.test(normalized)) obj.diameter = nums[0];
        else {
            obj.length = nums[0];
            if (nums[1] !== undefined) obj.width = nums[1];
            if (nums[2] !== undefined) obj.height = nums[2];
        }
        return obj;
    }

    function formatManualSizeCalc(sizeResult) {
        if (!sizeResult || sizeResult.diff === null || isNaN(sizeResult.diff)) return sizeResult?.reason === '微小' ? '尺寸差异（人工修正） = 微小' : '尺寸差异 = 人工尺寸未识别';
        let text = `尺寸差异（人工修正） = ${displayPercentValue(sizeResult.diff)}`;
        if (sizeResult.weightedDetails && sizeResult.weightedDetails.length) {
            const detail = sizeResult.weightedDetails.map(d => {
                const keyName = d.key === 'length' ? '长度' : (d.key === 'width' ? '宽度' : (d.key === 'height' ? '高度' : (d.key === 'diameter' ? '直径' : d.key)));
                return `${keyName}差异 ${Math.round(d.diffPercent)}%`;
            }).join('，');
            text += `（${detail}）`;
        }
        return text;
    }

    const MANUAL_SIZE_UNITS = [
        ['mm', '毫米 (mm)'], ['cm', '厘米 (cm)'], ['m', '米 (m)'], ['in', '英寸 (in)'], ['ft', '英尺 (ft)'],
        ['yd', '码 (yd)'], ['g', '克 (g)'], ['kg', '千克 (kg)'], ['ml', '毫升 (ml)'], ['l', '升 (L)']
    ];
    function manualSizeUnitOptionsHtml() {
        return MANUAL_SIZE_UNITS.map(([value, label]) => `<option value="${value}"${value === 'cm' ? ' selected' : ''}>${label}</option>`).join('');
    }
    function normalizeManualSizeUnit(unit) {
        const s = safeString(unit).trim().toLowerCase();
        if (/^(毫米|mm)$/.test(s)) return 'mm';
        if (/^(厘米|公分|cm)$/.test(s)) return 'cm';
        if (/^(米|m)$/.test(s)) return 'm';
        if (/^(英寸|inch|inches|in|"|″)$/.test(s)) return 'in';
        if (/^(英尺|feet|foot|ft|'|′)$/.test(s)) return 'ft';
        if (/^(码|yd)$/.test(s)) return 'yd';
        if (/^(克|g)$/.test(s)) return 'g';
        if (/^(千克|公斤|kg)$/.test(s)) return 'kg';
        if (/^(毫升|ml)$/.test(s)) return 'ml';
        if (/^(升|l|L)$/.test(s)) return 'l';
        return 'cm';
    }
    function parseManualScalarSize(text, unitOverride = 'cm') {
        const raw = safeString(text).trim();
        if (!raw) return null;
        const match = raw.match(/(\d+(?:\.\d+)?)/);
        if (!match) return null;
        const sourceUnit = safeString(unitOverride).trim() || (raw.match(/(毫米|厘米|公分|米|英寸|英尺|码|千克|公斤|克|毫升|升|mm|cm|m|in|inch|ft|yd|kg|g|ml|l)/i)?.[1] || 'cm');
        const unit = normalizeManualSizeUnit(sourceUnit);
        let value = parseFloat(match[1]);
        if (!isFinite(value) || value <= 0) return null;
        let kind = 'length';
        if (unit === 'mm') value /= 10;
        else if (unit === 'm') value *= 100;
        else if (unit === 'in') value *= 2.54;
        else if (unit === 'ft') value *= 30.48;
        else if (unit === 'yd') value *= 91.44;
        else if (unit === 'kg') { value *= 1000; kind = 'weight'; }
        else if (unit === 'g') kind = 'weight';
        else if (unit === 'l') { value *= 1000; kind = 'volume'; }
        else if (unit === 'ml') kind = 'volume';
        return { value, kind, baseUnit: kind === 'length' ? 'cm' : (kind === 'weight' ? 'g' : 'ml') };
    }
    function getManualSizeCount(container) {
        const select = container?.querySelector('.size-count-select');
        const count = parseInt(select?.value || '1', 10);
        return Math.min(10, Math.max(1, isFinite(count) ? count : 1));
    }
    function updateManualSizeRows(container) {
        if (!container) return 1;
        const count = getManualSizeCount(container);
        container.dataset.manualSizeCount = String(count);
        container.querySelectorAll('.manual-size-row').forEach(row => {
            const index = parseInt(row.dataset.index || '0', 10);
            row.hidden = index >= count;
        });
        return count;
    }
    function calculateManualMultiSizeDiff(container) {
        const count = getManualSizeCount(container);
        const sides = {};
        ['unbuilt', 'built'].forEach(side => {
            sides[side] = [...container.querySelectorAll(`.size-input[data-side="${side}"]`)].sort((a, b) => parseInt(a.dataset.index || '0', 10) - parseInt(b.dataset.index || '0', 10));
        });
        if (!sides.unbuilt.length || !sides.built.length) return { used: false, hasInput: false, reason: '' };
        const details = [];
        let hasInput = false, incomplete = false, invalid = false;
        for (let i = 0; i < count; i++) {
            const uInput = sides.unbuilt[i], bInput = sides.built[i];
            const uRaw = safeString(uInput?.value).trim(), bRaw = safeString(bInput?.value).trim();
            if (!uRaw && !bRaw) continue;
            hasInput = true;
            if (!uRaw || !bRaw) { incomplete = true; continue; }
            const u = parseManualScalarSize(uRaw, container.querySelector(`.size-unit[data-side="unbuilt"][data-index="${i}"]`)?.value || 'cm');
            const b = parseManualScalarSize(bRaw, container.querySelector(`.size-unit[data-side="built"][data-index="${i}"]`)?.value || 'cm');
            if (!u || !b || u.kind !== b.kind || b.value <= 0) { invalid = true; continue; }
            const diffPercent = Math.abs(u.value - b.value) / b.value * 100;
            details.push({ index: i + 1, unbuilt: u.value, built: b.value, diffPercent, weight: b.value, unit: b.baseUnit });
        }
        if (!hasInput) return { used: false, hasInput: false, reason: '' };
        if (incomplete || invalid || details.length !== count) return { used: false, hasInput: true, reason: invalid ? '人工尺寸单位或数值不匹配' : '人工尺寸未完整填写' };
        const totalWeight = details.reduce((sum, item) => sum + item.weight, 0);
        const weightedSum = details.reduce((sum, item) => sum + item.diffPercent * item.weight, 0);
        return { used: true, hasInput: true, diff: totalWeight > 0 ? weightedSum / totalWeight : 0, details, totalWeight, weightedSum, count };
    }
    function formatManualMultiSizeCalc(result) {
        if (!result?.used) return '';
        const details = result.details.map(item => `<div>第${item.index}组差异 = |${item.unbuilt.toFixed(2)} - ${item.built.toFixed(2)}| / ${item.built.toFixed(2)} × 100% = ${displayPercentValue(item.diffPercent)}（权重 ${item.weight.toFixed(2)}）</div>`).join('');
        return `<div>尺寸差异（人工加权） = ${displayPercentValue(result.diff)}</div>${details}<div>加权尺寸差异 = ${displayPercentValue(result.diff)}</div>`;
    }
    function renderManualSizeRows(side, aiSizeText) {
        const options = manualSizeUnitOptionsHtml();
        const recognized = aiSizeText && aiSizeText !== '-' ? aiSizeText : '未识别';
        return Array.from({ length: 10 }, (_, index) => `<div class="manual-size-row" data-side="${side}" data-index="${index}"${index > 0 ? ' hidden' : ''}><span class="manual-size-label">✏️ 尺寸${index > 0 ? index + 1 : ''}：</span><span class="manual-size-index">${index + 1}</span><input class="size-input" data-side="${side}" data-index="${index}" type="number" min="0" step="any" inputmode="decimal" placeholder="选填" title="按顺序填写第${index + 1}个尺寸"><select class="size-unit" data-side="${side}" data-index="${index}" title="选择第${index + 1}个尺寸的单位">${options}</select><span class="manual-size-fill">可填</span>${index === 0 ? `<span class="manual-size-ai" title="AI识别尺寸：${recognized}">${recognized}</span>` : ''}</div>`).join('');
    }
    function renderManualSizeSide(side, aiSizeText) {
        const title = side === 'unbuilt' ? '未建尺寸' : '已建尺寸';
        return `<div class="manual-size-side" aria-label="${title}"><div class="manual-size-side-title">${title}</div>${renderManualSizeRows(side, aiSizeText)}</div>`;
    }

    function normalizeAuditDifferenceFlag(value, fallback = false) {
        if (value === true || value === 1 || safeString(value).toLowerCase() === 'true') return true;
        if (value === false || value === 0 || safeString(value).toLowerCase() === 'false') return false;
        return fallback;
    }

    function getAuditVisualDifferenceFlags(res) {
        const shapeScore = normalizeDimensionScore(res?.shape_contour_percent);
        const patternScore = normalizeDimensionScore(res?.pattern_decoration_percent);
        return {
            styleDiff: normalizeAuditDifferenceFlag(res?.audit_style_shape_diff, shapeScore !== null && shapeScore >= 50),
            patternDiff: normalizeAuditDifferenceFlag(res?.audit_pattern_design_diff, patternScore !== null && patternScore >= 50)
        };
    }

    function buildFinalAuditRemark({ isPass, isPioneer = false, inProtection = false, marketPass = false, pioneerPassBasis = '', appearDiff = 0, quantityDiff = 0, sizeDiff = null, hasCombination = false, strongColor = false, styleDiff = false, patternDiff = false, materialDiff = false } = {}) {
        const appearance = Number(appearDiff) || 0;
        const quantity = Number(quantityDiff) || 0;
        const size = sizeDiff === null || sizeDiff === '' || !isFinite(Number(sizeDiff)) ? null : Number(sizeDiff);
        const hasQuantityDiff = quantity > 0;
        const hasSizeDiff = size !== null && size > 0;

        // 备注只提取人工审核常用的核心差异，不重复展示综合差异度和判定规则。
        if (isPass) {
            if (isPioneer && pioneerPassBasis === 'low_competition') return '上架竞争程度较低，可以尝试';
            if (isPioneer && pioneerPassBasis === 'material') return '材质大类差异，可以尝试';
            if (isPioneer && !inProtection && pioneerPassBasis.startsWith('out_')) return '保护期外差异维度满足，可以尝试';
            if (marketPass) return '上架竞争程度较低，细分市场差异较大，可以尝试';

            const reasons = [];
            if (hasCombination && (styleDiff || patternDiff || appearance >= 50)) reasons.push('组合搭配差异');
            if (styleDiff) reasons.push('款式差异');
            if (patternDiff) reasons.push('图案设计差异');
            if (strongColor && appearance >= 50) reasons.push('颜色差异');
            if (materialDiff) reasons.push('材质差异');
            if (hasSizeDiff) reasons.push('尺寸差异');
            if (hasQuantityDiff) reasons.push('数量差异');

            if (appearance >= 50 && !reasons.length) reasons.push('整体差异');
            if (!reasons.length) reasons.push(hasCombination ? '组合搭配差异' : '整体差异');
            return `${reasons.slice(0, 3).join('、')}，可以尝试`;
        }

        if (isPioneer && !inProtection && pioneerPassBasis.startsWith('out_')) return '首创保护期外差异维度未满足审核规则，暂不可建';
        if (isPioneer && appearance < 50) return '款式/图案差异不足、竞争程度不低且无材质大类差异，暂不可建';
        if (hasCombination && appearance < 50) return '组合搭配差异小，整体差异不足，暂不可建';

        // 不通过备注按人工审核习惯给出最能解释结论的一条主因，避免堆叠互相冲突的话术。
        if (!styleDiff && !patternDiff) {
            if (hasSizeDiff && size < 20) return '与已建款式一致，尺寸差异小，暂不可建';
            if (hasQuantityDiff && quantity < 20) return '款式一致，数量差异小，整体差异不足，暂不可建';
            return '款式一致，整体差异不足，暂不可建';
        }
        if (appearance < 50 && styleDiff && patternDiff) return '款式、图案设计差异较小，暂不可建';
        if (appearance < 50 && styleDiff) return '款式差异较小，整体差异不足，暂不可建';
        if (appearance < 50 && patternDiff) return '图案设计差异较小，整体差异不足，暂不可建';
        return '整体差异不足，暂不可建';
    }

    const CONFIDENCE_RULE_VERSION = '1.2';

    function getConfidenceLevel(score) {
        const n = Number(score) || 0;
        if (n >= 75) return 'high';
        if (n >= 50) return 'medium';
        return 'low';
    }

    function getConfidenceLevelLabel(level) {
        return level === 'high' ? '高置信' : (level === 'medium' ? '中置信' : '低置信');
    }

    function confidenceStrengthByDifference(diff) {
        const value = Math.max(0, Math.min(100, Number(diff) || 0));
        const distance = Math.abs(value - 50);
        if (distance >= 25) return { score: 100, forcedReview: false, label: `距离50%判定线${Math.round(distance)}个百分点` };
        if (distance >= 15) return { score: 85, forcedReview: false, label: `距离50%判定线${Math.round(distance)}个百分点` };
        if (distance >= 8) return { score: 65, forcedReview: false, label: `距离50%判定线${Math.round(distance)}个百分点` };
        if (distance > 4) return { score: 40, forcedReview: false, label: `接近50%判定线` };
        return { score: 10, forcedReview: true, label: '差异度处于46%-54%灰区' };
    }

    function singleDimensionConfidenceOverride(quantityDiff, sizeDiff) {
        const quantity = Number(quantityDiff);
        const size = Number(sizeDiff);
        const quantityExceeded = isFinite(quantity) && quantity > 50;
        const sizeExceeded = isFinite(size) && size > 50;
        if (!quantityExceeded && !sizeExceeded) return null;
        const label = quantityExceeded && sizeExceeded
            ? '数量差异度和尺寸差异度均超过50%，结果需人工复核后生效'
            : (quantityExceeded
                ? '数量差异度超过50%，结果需人工复核后生效'
                : '尺寸差异度超过50%，结果需人工复核后生效');
        return { score: 40, forcedReview: false, label, singleDimensionReview: true };
    }

    function uniqueEvidenceIssues(issues) {
        const seen = new Set();
        return (Array.isArray(issues) ? issues : []).filter(issue => {
            if (!issue || !issue.code || seen.has(issue.code)) return false;
            seen.add(issue.code);
            return true;
        });
    }

    function buildConfidenceEvidenceIssues({ sizeMissing = false, sizeUncertain = false, quantityUncertain = false, componentQuantityMismatch = false, quantitySourceUncertain = false, textShort = false, plusComponentsMissing = false, componentsUncertain = false, imageQualityPoor = false, pioneerDateMissing = false, aiUncertain = false } = {}) {
        const issues = [];
        if (sizeMissing) issues.push({ code: 'size_missing', label: '尺寸未识别', factor: 0.85 });
        else if (sizeUncertain) issues.push({ code: 'size_uncertain', label: '尺寸识别不确定', factor: 0.85 });
        if (quantityUncertain) issues.push({ code: 'quantity_uncertain', label: '数量识别需核对', factor: 0.80 });
        if (componentQuantityMismatch) issues.push({ code: 'component_quantity_mismatch', label: '明确总数与AI组件数量偏差超过30%', factor: 0.85 });
        if (quantitySourceUncertain) issues.push({ code: 'quantity_source_uncertain', label: 'AI数量来源为图片或推测', factor: 0.85 });
        if (textShort) issues.push({ code: 'text_short', label: '方案文字缺失或少于20字', factor: 0.85 });
        if (plusComponentsMissing) issues.push({ code: 'plus_components_missing', label: '组合方案未正确拆分组件', factor: 0.80 });
        else if (componentsUncertain) issues.push({ code: 'components_uncertain', label: '组件拆分不确定', factor: 0.85 });
        if (imageQualityPoor) issues.push({ code: 'image_quality', label: '图片质量较差', factor: 0.85 });
        if (pioneerDateMissing) issues.push({ code: 'pioneer_date_missing', label: '首创产品缺少建SKU时间', factor: 0.80 });
        if (aiUncertain) issues.push({ code: 'ai_uncertain', label: 'AI标记识别不确定', factor: 0.85 });
        return uniqueEvidenceIssues(issues);
    }

    function getConfidenceReviewAction(isPass, level, forcedReview = false) {
        if (forcedReview) return { text: '强制人工复核', requiresReview: true, sampleReview: false };
        if (isPass && level === 'high') return { text: '直接采信AI结果', requiresReview: false, sampleReview: false };
        if (isPass && level === 'medium') return { text: '采信并抽查10%-20%', requiresReview: false, sampleReview: true };
        if (isPass) return { text: '人工复核后生效', requiresReview: true, sampleReview: false };
        if (level === 'high') return { text: '直接采信，保留申诉/复核入口', requiresReview: false, sampleReview: false };
        return { text: '人工复核后生效', requiresReview: true, sampleReview: false };
    }

    function calculateComparisonConfidence({ isPass = false, isPioneer = false, decisionPath = 'combined', combinedDiff = 0, quantityDiff = null, sizeDiff = null, competitionLevel = '', marketReliable = true, evidenceIssues = [] } = {}) {
        let strength = isPioneer ? null : singleDimensionConfidenceOverride(quantityDiff, sizeDiff);
        if (!strength && decisionPath === 'market') {
            const base = marketReliable ? (competitionLevel === '无竞争' ? 90 : 75) : 35;
            strength = { score: base, forcedReview: false, label: marketReliable ? `${competitionLevel}且细分市场差异较大` : '市场分析空泛或前后不一致' };
        } else if (!strength && decisionPath === 'pioneer_protection') {
            strength = { score: 100, forcedReview: false, label: '首创保护期规则明确' };
        } else if (!strength && decisionPath === 'pioneer_missing_date') {
            strength = { score: 40, forcedReview: false, label: '首创保护期无法准确计算' };
        } else if (!strength) {
            strength = confidenceStrengthByDifference(combinedDiff);
        }
        const issues = uniqueEvidenceIssues(evidenceIssues);
        let coefficient = issues.reduce((value, issue) => value * (Number(issue.factor) || 1), 1);
        coefficient = Math.max(0.3, coefficient);
        const score = Math.max(0, Math.min(100, Math.round(strength.score * coefficient)));
        const level = getConfidenceLevel(score);
        const action = getConfidenceReviewAction(isPass, level, strength.forcedReview);
        const reasons = [strength.label, ...issues.map(issue => issue.label)];
        const factorText = issues.length ? issues.map(issue => `${issue.factor.toFixed(2)}`).join(' × ') : '1.00';
        return {
            score,
            level,
            levelLabel: getConfidenceLevelLabel(level),
            baseScore: strength.score,
            coefficient,
            forcedReview: strength.forcedReview,
            requiresReview: action.requiresReview,
            sampleReview: action.sampleReview,
            action: action.text,
            reasons,
            evidenceIssues: issues,
            formula: `强度分${strength.score} × 证据系数${factorText} = ${score}`,
            isPioneer: isPioneer === true,
            decisionPath,
            combinedDiff: Number(combinedDiff) || 0,
            quantityDiff: isFinite(Number(quantityDiff)) ? Number(quantityDiff) : null,
            sizeDiff: isFinite(Number(sizeDiff)) ? Number(sizeDiff) : null,
            singleDimensionReview: strength.singleDimensionReview === true,
            competitionLevel,
            marketReliable,
            ruleVersion: CONFIDENCE_RULE_VERSION
        };
    }

    function addMixedOutcomeEvidence(confidence, isPass) {
        if (!confidence) return confidence;
        return calculateComparisonConfidence({
            isPass,
            isPioneer: confidence.isPioneer,
            decisionPath: confidence.decisionPath,
            combinedDiff: confidence.combinedDiff,
            quantityDiff: confidence.quantityDiff,
            sizeDiff: confidence.sizeDiff,
            competitionLevel: confidence.competitionLevel,
            marketReliable: confidence.marketReliable,
            evidenceIssues: [...confidence.evidenceIssues, { code: 'mixed_outcomes', label: '多个已建对比结论不一致', factor: 0.85 }]
        });
    }

    function renderConfidenceDetail(confidence) {
        if (!confidence) return '';
        const reasons = confidence.reasons.length ? confidence.reasons.join('；') : '证据完整';
        return `<div class="confidence-detail"><div class="confidence-detail-title">结果置信度 <span class="confidence-score">${confidence.score}</span><span class="confidence-badge ${confidence.level}">${confidence.levelLabel}</span><span class="review-action ${confidence.requiresReview ? 'required' : ''}">${confidence.action}</span></div><div class="confidence-formula">${confidence.formula}</div><div class="confidence-reason-list">原因：${escapeHtml(reasons)}</div></div>`;
    }

    function parseConfidenceEvidenceFromElement(result) {
        try {
            return uniqueEvidenceIssues(JSON.parse(decodeURIComponent(result.dataset.confidenceEvidence || '[]')));
        } catch (e) {
            return [];
        }
    }

    function calculateConfidenceFromElement(result, mixedOutcomes = false) {
        const conclusion = result.querySelector('.conclusion-text')?.textContent || '';
        const isPass = conclusion.includes('通过') && !conclusion.includes('不通过');
        const combined = parseQuantityValue(result.querySelector('.combined-value')?.textContent);
        const quantityDiff = Number(result.dataset.quantityDiff);
        const currentSizeDiff = result.dataset.currentSizeDiff !== '' && result.dataset.currentSizeDiff !== undefined
            ? Number(result.dataset.currentSizeDiff)
            : Number(result.dataset.sizeDiff);
        let decisionPath = result.dataset.confidencePath || 'combined';
        if (decisionPath === 'market' && combined >= 50) decisionPath = 'combined';
        let issues = parseConfidenceEvidenceFromElement(result);
        const manualSize = calculateManualMultiSizeDiff(result);
        if (manualSize.used) issues = issues.filter(issue => !['size_missing', 'size_uncertain'].includes(issue.code));
        const quantityChanged = [...result.querySelectorAll('.qty-input')].some(input => input.dataset.original !== undefined && String(input.value) !== String(input.dataset.original));
        if (quantityChanged) issues = issues.filter(issue => !['quantity_uncertain', 'quantity_source_uncertain'].includes(issue.code));
        if (mixedOutcomes) issues.push({ code: 'mixed_outcomes', label: '多个已建对比结论不一致', factor: 0.85 });
        return calculateComparisonConfidence({
            isPass,
            isPioneer: result.dataset.pioneer === '1' && result.dataset.pioneerRule !== '0',
            decisionPath,
            combinedDiff: isFinite(combined) ? combined : 0,
            quantityDiff: isFinite(quantityDiff) ? quantityDiff : null,
            sizeDiff: result.dataset.skipSize === '1' || !isFinite(currentSizeDiff) ? null : currentSizeDiff,
            competitionLevel: result.dataset.competitionLevel || '',
            marketReliable: result.dataset.marketReliable !== '0',
            evidenceIssues: issues
        });
    }

    function updateRecordConfidence(recordItem, persist = true) {
        if (!recordItem) return null;
        const results = [...recordItem.querySelectorAll('.comparison-result')];
        if (!results.length) return null;
        const decisions = results.map(result => {
            const text = result.querySelector('.conclusion-text')?.textContent || '';
            return text.includes('通过') && !text.includes('不通过');
        });
        const mixedOutcomes = decisions.some(Boolean) && decisions.some(value => !value);
        const confidences = results.map((result, index) => {
            const confidence = calculateConfidenceFromElement(result, mixedOutcomes);
            const detail = result.querySelector('.confidence-detail');
            if (detail) detail.outerHTML = renderConfidenceDetail(confidence);
            const summaryConfidence = recordItem.querySelector(`.comparison-summary-row[data-summary-index="${result.dataset.comparisonIndex}"] .comparison-summary-confidence`);
            if (summaryConfidence) summaryConfidence.textContent = `，置信度 ${confidence.score}`;
            return { ...confidence, isPass: decisions[index], comparisonIndex: result.dataset.comparisonIndex };
        });
        const finalConfidence = [...confidences].sort((a, b) => a.score - b.score)[0];
        const finalPass = decisions.every(Boolean);
        const finalAction = getConfidenceReviewAction(finalPass, finalConfidence.level, finalConfidence.forcedReview);
        finalConfidence.action = finalAction.text;
        finalConfidence.requiresReview = finalAction.requiresReview;
        finalConfidence.sampleReview = finalAction.sampleReview;
        const scoreEl = recordItem.querySelector('.summary-confidence-score');
        const badgeEl = recordItem.querySelector('.summary-confidence-badge');
        const actionEl = recordItem.querySelector('.summary-review-action');
        const reasonsEl = recordItem.querySelector('.summary-confidence-reasons');
        if (scoreEl) scoreEl.textContent = String(finalConfidence.score);
        if (badgeEl) {
            badgeEl.textContent = finalConfidence.levelLabel;
            badgeEl.className = `confidence-badge summary-confidence-badge ${finalConfidence.level}`;
        }
        if (actionEl) {
            actionEl.textContent = finalConfidence.action;
            actionEl.classList.toggle('required', finalConfidence.requiresReview);
        }
        if (reasonsEl) reasonsEl.textContent = `原因：${finalConfidence.reasons.join('；')}`;
        recordItem.dataset.confidenceScore = String(finalConfidence.score);
        recordItem.dataset.confidenceLevel = finalConfidence.level;
        recordItem.dataset.requiresReview = finalConfidence.requiresReview ? '1' : '0';
        recordItem._latestConfidence = {
            score: finalConfidence.score,
            level: finalConfidence.level,
            requiresReview: finalConfidence.requiresReview,
            action: finalConfidence.action,
            reasons: finalConfidence.reasons,
            comparisonConfidences: confidences
        };
        if (persist && recordItem.dataset.id) {
            const record = historyRecords.find(item => String(item.id) === String(recordItem.dataset.id));
            if (record) {
                record.confidenceScore = finalConfidence.score;
                record.confidenceLevel = finalConfidence.level;
                record.requiresReview = finalConfidence.requiresReview;
                record.reviewAction = finalConfidence.action;
                record.confidenceReasons = finalConfidence.reasons;
                record.comparisonConfidences = confidences;
                record.summaryHtml = recordItem.innerHTML;
                saveHistory();
            }
        }
        return { finalConfidence, confidences, mixedOutcomes };
    }

    function auditRemarkFromComparisonElement(result) {
        if (!result) return '';
        const conclusion = result.querySelector('.conclusion-text')?.textContent || '';
        const isPass = conclusion.includes('通过') && !conclusion.includes('不通过');
        return buildFinalAuditRemark({
            isPass,
            isPioneer: result.dataset.pioneer === '1' && result.dataset.pioneerRule !== '0',
            inProtection: result.dataset.inProtection === '1',
            marketPass: result.dataset.marketPass === '1',
            pioneerPassBasis: result.dataset.pioneerPassBasis || (result.dataset.pioneer === '1' && result.dataset.pioneerRule !== '0'
                ? (Number(result.dataset.appearDiff) >= 50
                    ? 'appearance'
                    : ((result.dataset.competitionLevel === '较低竞争' || result.dataset.competitionLevel === '无竞争')
                        ? 'low_competition'
                        : (result.dataset.materialDiff === '1' ? 'material' : '')))
                : ''),
            appearDiff: result.dataset.appearDiff,
            quantityDiff: result.dataset.quantityDiff,
            sizeDiff: result.dataset.currentSizeDiff ?? result.dataset.sizeDiff,
            hasCombination: result.dataset.hasCombination === '1',
            strongColor: result.dataset.strongColor === '1',
            styleDiff: result.dataset.styleDiff === '1',
            patternDiff: result.dataset.patternDiff === '1',
            materialDiff: result.dataset.materialDiff === '1'
        });
    }

    function updateRecordAuditRemark(recordItem) {
        if (!recordItem) return;
        const results = [...recordItem.querySelectorAll('.comparison-result')];
        if (!results.length) return;
        const rows = results.map(result => {
            const conclusion = result.querySelector('.conclusion-text')?.textContent || '';
            const isPass = conclusion.includes('通过') && !conclusion.includes('不通过');
            const combined = parseQuantityValue(result.querySelector('.combined-value')?.textContent);
            const appearance = Number(result.dataset.appearDiff);
            const isPioneer = result.dataset.pioneer === '1' && result.dataset.pioneerRule !== '0';
            return { result, isPass, isPioneer, combined: isFinite(combined) ? combined : 0, appearance: isFinite(appearance) ? appearance : 0 };
        });
        const allPass = rows.every(row => row.isPass);
        const failedRows = rows.filter(row => !row.isPass);
        const failedPioneerRows = failedRows.filter(row => row.isPioneer);
        const candidates = allPass ? rows : (failedPioneerRows.length ? failedPioneerRows : failedRows);
        candidates.sort((a, b) => failedPioneerRows.length && !allPass
            ? a.appearance - b.appearance
            : a.combined - b.combined);
        const noteText = recordItem.querySelector('.summary-audit-note-text');
        if (noteText && candidates[0]) noteText.textContent = auditRemarkFromComparisonElement(candidates[0].result);
    }

    function recalcManualQuantityDiff(container) {
        if (!container) return;
        const unbuiltInput = container.querySelector('.qty-input[data-side="unbuilt"]');
        const builtInput = container.querySelector('.qty-input[data-side="built"]');
        if (!unbuiltInput || !builtInput) return;
        const qtyUnbuilt = parseFloat(unbuiltInput.value);
        const qtyBuilt = parseFloat(builtInput.value);
        if (!isFinite(qtyUnbuilt) || !isFinite(qtyBuilt) || qtyBuilt <= 0) return;
        const qDiff = Math.abs(qtyUnbuilt - qtyBuilt) / qtyBuilt * 100;
        const sizeDiffRaw = container.dataset.sizeDiff;
        let sizeDiff = sizeDiffRaw === '' || sizeDiffRaw === undefined ? null : parseFloat(sizeDiffRaw);
        const appearDiff = parseFloat(container.dataset.appearDiff) || 0;
        const skipSize = container.dataset.skipSize === '1';
        const manualSizeResult = calculateManualMultiSizeDiff(container);
        const manualSizeUsed = manualSizeResult.used === true;
        if (manualSizeUsed) sizeDiff = manualSizeResult.diff;
        const sizeIncluded = manualSizeUsed || (!skipSize && sizeDiff !== null && !isNaN(sizeDiff));
        const storedOutsideSizeDiff = Number(container.dataset.outsideSizeDiff);
        const outsideRuleSizeDiff = manualSizeUsed
            ? sizeDiff
            : (isFinite(storedOutsideSizeDiff) && storedOutsideSizeDiff > 0 ? storedOutsideSizeDiff : (sizeIncluded ? sizeDiff : null));
        let schemeDiff = 0;
        let combined = appearDiff;
        schemeDiff += qDiff;
        combined += qDiff;
        if (sizeIncluded) {
            schemeDiff += sizeDiff;
            combined += sizeDiff;
        }
        container.dataset.quantityDiff = String(qDiff);
        container.dataset.currentSizeDiff = sizeIncluded ? String(sizeDiff) : '';
        const schemeValue = container.querySelector('.scheme-value');
        const schemeSub = container.querySelector('.scheme-sub');
        const combinedValue = container.querySelector('.combined-value');
        const combinedSub = container.querySelector('.combined-sub');
        const quantityCalc = container.querySelector('.quantity-calc');
        const sizeCalc = container.querySelector('.size-calc');
        const combinedCalc = container.querySelector('.combined-calc');
        const conclusionText = container.querySelector('.conclusion-text');
        if (schemeValue) schemeValue.textContent = displayPercentValue(schemeDiff);
        if (schemeSub) schemeSub.textContent = `数量差 ${displayPercentValue(qDiff)} + 尺寸差 ${sizeIncluded ? displayPercentValue(sizeDiff) : '—'}`;
        if (combinedValue) combinedValue.textContent = displayPercentValue(combined);
        if (combinedSub) combinedSub.textContent = sizeIncluded ? '数量差 + 尺寸差 + 图案差' : '数量差 + 尺寸差不计 + 图案差';
        if (quantityCalc) quantityCalc.textContent = `数量差异 = |${qtyUnbuilt} - ${qtyBuilt}| / ${qtyBuilt} × 100% = ${displayPercentValue(qDiff)}（人工修正）`;
        if (sizeCalc && !sizeCalc.dataset.originalHtml) sizeCalc.dataset.originalHtml = sizeCalc.innerHTML;
        container.querySelectorAll('.size-auto-detail').forEach(el => { el.hidden = manualSizeUsed; });
        if (sizeCalc && manualSizeUsed) sizeCalc.innerHTML = formatManualMultiSizeCalc(manualSizeResult);
        else if (sizeCalc && manualSizeResult.hasInput) sizeCalc.textContent = `尺寸差异 = ${manualSizeResult.reason}，暂沿用AI识别结果`;
        else if (sizeCalc && sizeCalc.dataset.originalHtml) sizeCalc.innerHTML = sizeCalc.dataset.originalHtml;
        if (combinedCalc) combinedCalc.textContent = `综合差异 = ${displayPercentValue(combined)}`;
        hydrateProtectionRuleData(container);
        const marketEligible = container.dataset.marketEligible === '1' || container.dataset.marketPass === '1';
        let marketPassUsed = false;
        if (conclusionText && container.dataset.pioneer === '1' && container.dataset.pioneerRule !== '0' && container.dataset.inProtection !== '1') {
            const rule = evaluateOutOfProtectionRule({
                res: {
                    overall_percent: appearDiff,
                    color_difference_percent: container.dataset.colorDiff,
                    _materialMajor: container.dataset.materialDiff === '1'
                },
                qDiff,
                sizeDiff: outsideRuleSizeDiff
            });
            marketPassUsed = !rule.pass && marketEligible;
            const finalPass = rule.pass || marketEligible;
            conclusionText.textContent = finalPass ? '✅ 通过' : '❌ 不通过';
            conclusionText.classList.toggle('pass', finalPass);
            conclusionText.classList.toggle('fail', !finalPass);
        } else if (conclusionText && container.dataset.outsideOtherBuilt === '1') {
            const rule = evaluateOutOfProtectionOtherBuiltRule({
                res: {
                    overall_percent: appearDiff,
                    color_difference_percent: container.dataset.colorDiff,
                    _materialMajor: container.dataset.materialDiff === '1'
                },
                qDiff,
                sizeDiff: outsideRuleSizeDiff
            });
            marketPassUsed = !rule.pass && marketEligible;
            const finalPass = rule.pass || marketEligible;
            conclusionText.textContent = finalPass ? '✅ 通过' : '❌ 不通过';
            conclusionText.classList.toggle('pass', finalPass);
            conclusionText.classList.toggle('fail', !finalPass);
        } else if (conclusionText && (container.dataset.pioneer !== '1' || container.dataset.pioneerRule === '0')) {
            marketPassUsed = combined < 50 && marketEligible;
            const isPass = combined >= 50 || marketEligible;
            conclusionText.textContent = isPass ? '✅ 通过' : '❌ 不通过';
            conclusionText.classList.toggle('pass', isPass);
            conclusionText.classList.toggle('fail', !isPass);
        }
        container.dataset.marketPass = marketPassUsed ? '1' : '0';
        const recordItem = container.closest('.record-item');
        if (recordItem) {
            updateRecordSummaryMetric(recordItem);
            const allPass = [...recordItem.querySelectorAll('.comparison-result .conclusion-text')]
                .every(el => el.textContent.includes('通过') && !el.textContent.includes('不通过'));
            const summaryStatus = recordItem.querySelector('.summary-pass-status');
            if (summaryStatus) summaryStatus.textContent = allPass ? '✅ 通过' : '❌ 不通过';
            recordItem.querySelectorAll('.comparison-summary-row').forEach(row => {
                const index = row.dataset.summaryIndex;
                const result = recordItem.querySelector(`.comparison-result[data-comparison-index="${index}"]`);
                if (!result) return;
                updateComparisonSummaryMetric(row, result);
            });
            updateRecordAuditRemark(recordItem);
            // 输入过程中只更新当前记录的界面，保存延后到防抖计时器，避免每个字符触发整库写入。
            updateRecordConfidence(recordItem, false);
            scheduleManualRecordSave(recordItem);
        }
    }

    function splitTopLevelSolutionParts(text, separatorPattern) {
        const source = safeString(text);
        const parts = [], separators = separatorPattern || /[+＋]/;
        let current = '', round = 0, square = 0, curly = 0;
        for (const char of source) {
            if (char === '(' || char === '（') round++;
            else if (char === ')' || char === '）') round = Math.max(0, round - 1);
            else if (char === '[' || char === '【') square++;
            else if (char === ']' || char === '】') square = Math.max(0, square - 1);
            else if (char === '{' || char === '｛') curly++;
            else if (char === '}' || char === '｝') curly = Math.max(0, curly - 1);
            if (round === 0 && square === 0 && curly === 0 && separators.test(char)) {
                if (current.trim()) parts.push(current.trim());
                current = '';
            } else current += char;
        }
        if (current.trim()) parts.push(current.trim());
        return parts;
    }

    function solutionQuantityFromPart(part) {
        const seg = safeString(part).replace(/补充备注[：:].*$/g, '').replace(/供\s*\d+\s*个/g, '').trim();
        const units = QUANTITY_UNIT_PATTERN;
        const bracketText = seg.match(/[【\[]([\s\S]*?)[】\]]/)?.[1] || seg;
        const mainText = bracketText
            .replace(/^\s*(?:[（(]\s*(?:供[^）)]*|配|定制)\s*[）)]\s*)+/g, '')
            .split(/[（(](?=\s*(?:颜色|尺寸|材质|款式|其他)\s*[：:])/)[0];
        const countPerSet = mainText.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${units})\\s*(?:组成|合为|为|装为)?\\s*(?:1|一)\\s*(?:套|组)(?=\\s|$|[^\\d])`, 'i'));
        if (countPerSet) return { quantity: parseFloat(countPerSet[1]) || 0, unit: countPerSet[2] };
        const starMatches = [...mainText.matchAll(new RegExp(`(?:\\*|×|x)\\s*(\\d+(?:\\.\\d+)?)(?:\\s*${units})?`, 'gi'))];
        const matches = [...mainText.matchAll(new RegExp(`(?:^|[^\\d])(?:(?:白色|红色|黄色|紫色|绿色|蓝色|粉色|黑色|棕色|双绿|白绿)\\s*)?(\\d+(?:\\.\\d+)?)\\s*(${units})(?=\\s|$|[^\\d])`, 'gi'))];
        // 同一分项可能同时出现内部规格数量和实际销售数量，例如“*150根 1包”。
        // 取文本中最后出现的明确数量，避免把包内数量误当成该组件的销售数量。
        const candidates = [];
        starMatches.forEach(match => {
            const unitMatch = match[0].match(new RegExp(units, 'i'));
            candidates.push({ index: match.index || 0, quantity: parseFloat(match[1]) || 0, unit: unitMatch?.[0] || '个' });
        });
        matches.forEach(match => {
            const numberOffset = match[0].lastIndexOf(match[1]);
            candidates.push({ index: (match.index || 0) + Math.max(0, numberOffset), quantity: parseFloat(match[1]) || 0, unit: match[2] });
        });
        if (!candidates.length) return { quantity: 0, unit: '' };
        candidates.sort((a, b) => a.index - b.index);
        const last = candidates[candidates.length - 1];
        return { quantity: last.quantity, unit: last.unit };
    }

    function cleanSolutionComponentName(part) {
        const raw = safeString(part).replace(/补充备注[：:].*$/g, '').trim();
        const bracketText = raw.match(/[【\[]([^】\]]+)/)?.[1] || '';
        let name = (bracketText || raw
            .replace(/^\s*\d{8,}\s*/, '')
            .replace(/^\s*[A-Za-z]{1,12}[A-Za-z0-9-]*\d[A-Za-z0-9-]*\s*[：:]\s*/, '')).trim();
        // “（供一）/（供二）/（配）/（定制）”是供应或流程标记，不是产品名称。
        // 必须先移除，否则后续按属性括号截取时会把真实名称截成空字符串。
        name = name.replace(/^\s*(?:[（(]\s*(?:供[^）)]*|配|定制)\s*[）)]\s*)+/g, '').trim();
        // 产品名称后的“，1个”“，每款1个，共3个”等属于数量描述，名称在此处结束。
        name = name.split(new RegExp(`[,，]\\s*(?=(?:(?:每|各)\\s*(?:款|种)?|共|总计|合计|一共|总共)?\\s*\\d+(?:\\.\\d+)?\\s*${QUANTITY_UNIT_PATTERN})`, 'i'))[0];
        name = name.split(/[（(【\[]/)[0]
            .replace(new RegExp(`(?:\\*|×|x)\\s*\\d+(?:\\.\\d+)?\\s*${QUANTITY_UNIT_PATTERN}?`, 'gi'), ' ')
            .replace(new RegExp(`\\d+(?:\\.\\d+)?\\s*${QUANTITY_UNIT_PATTERN}`, 'gi'), ' ')
            .replace(/\s*(?:一套|一组|一包)\s*$/g, '')
            .replace(/[【】\[\]：:，,；;]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
        return name;
    }

    function extractNestedComponentDefinitions(part) {
        const raw = safeString(part).replace(/补充备注[：:][\s\S]*$/i, '').trim();
        if (!raw || !/[+＋]/.test(raw)) return [];
        const parentName = cleanSolutionComponentName(raw);
        // 只有“配件/附件/材料包”等总称才向内展开，避免把普通产品的尺寸、结构或装饰说明误拆成组件。
        if (!/(?:配件|附件|材料包|辅料包|零件包|装饰包|工具包|配套包|组合包)$/.test(parentName)) return [];
        const parentQuantity = solutionQuantityFromPart(raw);
        const bracketContent = raw.match(/[（(]([\s\S]*)[）)]/)?.[1] || raw.match(/[【\[]([\s\S]*)[】\]]/)?.[1] || '';
        if (!bracketContent || !/[+＋]/.test(bracketContent)) return [];
        let detailText = bracketContent;
        const detailStart = detailText.match(/(?:尺寸|款式|内含|包含|含有|配有|配件明细|组件)[：:]\s*([\s\S]*)/i);
        if (detailStart) detailText = detailStart[1];
        detailText = detailText.split(/[，,；;]\s*(?=(?:其他|材质|颜色|包装|工艺|备注|补充备注|说明)\s*[：:])/i)[0];
        const segments = splitTopLevelSolutionParts(detailText, /[+＋]/);
        if (segments.length < 2) return [];
        const units = QUANTITY_UNIT_PATTERN;
        const definitions = segments.map(segment => {
            const matches = [...segment.matchAll(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${units})`, 'gi'))];
            if (!matches.length) return null;
            const quantityMatch = matches[matches.length - 1];
            let name = segment.slice(0, quantityMatch.index).trim()
                .replace(/^(?:尺寸|款式|内含|包含|含有|配有|配件明细|组件)\s*[：:]\s*/i, '')
                .replace(/^[，,；;、\s]+|[，,；;、\s]+$/g, '')
                .replace(/\s+/g, ' ');
            if (!name || !/[\u4e00-\u9fa5A-Za-z]/.test(name)) return null;
            // 尺寸前缀保留在名称中，用于区分同名但规格不同的明确组件。
            name = name.replace(/\s*的\s*/g, '');
            return {
                quantity: parseFloat(quantityMatch[1]) || 0,
                unit: quantityMatch[2],
                part: segment.trim(),
                name
            };
        }).filter(item => item && item.quantity > 0);
        if (definitions.length !== segments.length || definitions.length < 2) return [];
        const nestedTotal = definitions.reduce((sum, item) => sum + item.quantity, 0);
        // “配件3个”只能在内部明细合计也为3时展开；“1套/1包”允许展示其明确列出的子件。
        if (parentQuantity.quantity > 0 && !/^(?:套|组|包|盒|袋)$/.test(parentQuantity.unit) && nestedTotal !== parentQuantity.quantity) return [];
        return definitions;
    }

    function extractExplicitComponentDefinitions(text) {
        // 组件边界必须先从完整标题中识别；提前删除尺寸片段会误删
        // “尺寸：贝壳1个+海星1个+海星1个”这类明确的配件明细。
        let s = extractSolutionTitleText(text);
        if (!s) return [];
        // 句末“共N个/总计N件”是整条方案总数，不得被归到最后一个加号分项。
        s = s.replace(new RegExp(`(?:共|总计|合计|一共|总共)\\s*\\d+(?:\\.\\d+)?\\s*${QUANTITY_UNIT_PATTERN}\\s*$`, 'i'), '').trim();
        const hasPlus = /[+＋]/.test(s);
        const parts = hasPlus ? splitTopLevelSolutionParts(s, /[+＋]/) : splitTopLevelSolutionParts(s, /[,，、;；]/);
        if (parts.length < 2) return extractNestedComponentDefinitions(s);
        const definitions = parts.flatMap(part => {
            const nested = extractNestedComponentDefinitions(part);
            if (nested.length >= 2) return nested;
            const q = solutionQuantityFromPart(part);
            return q.quantity > 0
                ? [{ quantity: q.quantity, unit: q.unit, part: part.trim(), name: cleanSolutionComponentName(part) }]
                : [];
        });
        // 只有所有顶层分项都各自写明数量时才展示组件，未标数量的分项不能默认补1。
        if (definitions.length !== parts.length || definitions.length < 2) return [];
        return definitions;
    }

    function extractPlusSeparatedQuantities(text) {
        return extractExplicitComponentDefinitions(text);
    }

    function sumPlusSeparatedQuantities(text) {
        const quantities = extractPlusSeparatedQuantities(text);
        if (quantities.length < 2) return null;

        // 组合总数量代表“几套/几件主产品”，不是所有子件数量之和。
        // 例如：30个杯子 + 30个盖子 + 1个盘子 + 10个吸管，结果应为30。
        const accessoryPattern = /(吸管|杯盖|盖子|瓶盖|盖帽|杯塞|配件|附件|餐具|刀叉|叉子|汤勺|勺子|筷子|卡片|贺卡|标签|包装|包装纸|袋子|手提袋|丝带|缎带|胶带|贴纸|点胶|胶水|挂钩|粘钩|支架|底座|绑带|挂绳|绳子|说明书|电源|遥控器|充气泵|连接线)/i;
        const mainProductPattern = /(杯|瓶|罐|碗|篮|桶|箱|托盘|盘子?|餐盘|地毯|地垫|挂布|挂毯|横幅|拉旗|旗帜|窗帘|桌布|花环|花束|拱门|背景布|背景板|摆件|玩偶|公仔|气球|挂件|吊饰|装饰球|圣诞球|手套|袜子|衣服|裙|包|清洁液|清洁剂|喷雾|灯|笔|画板|浴巾|杯垫|浇水器|植物|绿植|花材)/i;
        const isAccessory = item => accessoryPattern.test(safeString(item?.name));
        const isMain = item => mainProductPattern.test(safeString(item?.name)) && !isAccessory(item);

        // 明确写出的“X套/X组”优先表示整套销售数量，且必须是主产品分项。
        const setQuantity = quantities.find(item => /^(套|组)$/.test(item.unit) && isMain(item));
        if (setQuantity) return setQuantity.quantity;

        // 组装型方案中，某一分项数量可能与其余主体分项数量之和一致，表示一一配套加工。
        // 例如1个主体款+3个主体款+4个对应加工件，最终数量为4，不把三个分项直接相加。
        const nonAccessoryItems = quantities.filter(item => !isAccessory(item));
        if (nonAccessoryItems.length >= 3) {
            const values = nonAccessoryItems.map(item => item.quantity).filter(value => value > 0).sort((a, b) => b - a);
            if (values.length === nonAccessoryItems.length && Math.abs(values[0] - values.slice(1).reduce((sum, value) => sum + value, 0)) < 0.0001) {
                return values[0];
            }
        }

        // 一般组合：优先取主产品数量。多个主产品时取最能代表套装单位的数量，
        // 不把盖子、吸管、盘子等附属数量叠加进去。
        const mainItems = quantities.filter(isMain);
        if (mainItems.length) {
            const ranked = mainItems.map(item => {
                const name = safeString(item.name);
                let score = 0;
                if (/(杯|瓶|罐|碗|篮|桶|地毯|地垫|挂布|花束|气球|灯|清洁液|清洁剂|喷雾)/i.test(name)) score += 4;
                if (/(托盘|盘子?|摆件|挂件|装饰球|圣诞球)/i.test(name)) score += 2;
                if (/套|组/.test(item.unit)) score += 3;
                return { item, score };
            }).sort((a, b) => b.score - a.score || b.item.quantity - a.item.quantity);
            const top = ranked[0];
            const sameRole = ranked.filter(entry => entry.score === top.score);
            if (sameRole.length === 1) return top.item.quantity;
            // 同等主产品只取共同套数；不同数量时取最大主产品数量，避免把配件叠加进去。
            const quantitiesOfSameRole = sameRole.map(entry => entry.item.quantity);
            if (quantitiesOfSameRole.every(value => value === quantitiesOfSameRole[0])) return quantitiesOfSameRole[0];
            return Math.max(...quantitiesOfSameRole);
        }

        // 没有可识别主产品时才保守处理：相同分项数量视为同一套数；
        // 不同数量无法确认主次，返回 null，由上层按1兜底，不从图片猜数。
        const values = quantities.map(item => item.quantity).filter(value => value > 0);
        if (!values.length) return null;
        if (values.every(value => value === values[0])) return values[0];
        return null;
    }

    function extractMainProductQuantityBeforeAccessory(text) {
        const s = safeString(text);
        if (!s) return null;
        const accessoryLead = /(搭配|配|配套|附带|含|包含|另配|加配|赠|赠送).{0,18}(造雾器|雾化器|适配器|水架|支架|底座|电源|遥控器|充气泵|气泵|连接线|挂绳|配件|包装|袋|盒|贴纸|点胶|胶水|丝带|卡片|贺卡)/;
        if (!accessoryLead.test(s)) return null;
        const before = s.split(/\+?\s*补充备注\s*[：:]/i)[0].split(accessoryLead)[0];
        const matches = [...before.matchAll(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${QUANTITY_UNIT_PATTERN})`, 'gi'))];
        if (!matches.length) return null;
        const last = matches[matches.length - 1];
        return { qty: parseFloat(last[1]), unit: last[2] };
    }

    function extractSolutionQuantityInfo(text) {
        const s = stripInternalGridCounts(text);
        if (!s) return { quantity: 1, source: 'default' };
        const units = QUANTITY_UNIT_PATTERN;
        const topLevelPlusParts = splitTopLevelSolutionParts(s, /[+＋]/);
        if (topLevelPlusParts.length >= 2) {
            // 只有每个加号分项都明确标注数量时才按组件关系计算；否则读取整条方案的显式总量。
            const plusQty = sumPlusSeparatedQuantities(s);
            if (plusQty !== null && plusQty !== undefined && plusQty > 0) return { quantity: plusQty, source: 'text' };
            const explicitTotal = extractExplicitTotalQuantity(s);
            if (explicitTotal !== null && explicitTotal > 0) return { quantity: explicitTotal, source: 'text' };
            const genericPlusQty = extractPrimaryQuantity(s);
            return genericPlusQty !== null && genericPlusQty > 0
                ? { quantity: genericPlusQty, source: 'text' }
                : { quantity: 1, source: 'default' };
        }
        const explicitTotal = extractExplicitTotalQuantity(s);
        if (explicitTotal !== null && explicitTotal > 0) return { quantity: explicitTotal, source: 'text' };
        let match = s.match(new RegExp(`(?:共|总计|合计|一共|总共)\\s*(\\d+(?:\\.\\d+)?)\\s*${units}`));
        if (match) return { quantity: parseFloat(match[1]), source: 'text' };
        const styleEachPatterns = [
            new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(?:款|种)(?:图案|款式)?[^0-9]{0,20}?每\\s*(?:款|种|款式)?\\s*(\\d+(?:\\.\\d+)?)\\s*${units}`),
            new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(?:款|种)(?:图案|款式)?[^0-9]{0,20}?(?:各|分别)\\s*(\\d+(?:\\.\\d+)?)\\s*${units}`)
        ];
        for (const stylePattern of styleEachPatterns) {
            match = s.match(stylePattern);
            if (match) return { quantity: parseFloat(match[1]) * parseFloat(match[2]), source: 'text' };
        }
        match = s.match(/(\d+(?:\.\d+)?)\s*大\s*(\d+(?:\.\d+)?)\s*小/);
        if (match) return { quantity: parseFloat(match[1]) + parseFloat(match[2]), source: 'text' };
        const main = extractMainProductQuantityBeforeAccessory(s);
        if (main && main.qty > 0) return { quantity: main.qty, source: 'text' };
        const generic = extractPrimaryQuantity(s);
        return generic !== null && generic !== undefined && generic > 0
            ? { quantity: generic, source: 'text' }
            : { quantity: 1, source: 'default' };
    }

    function extractSolutionQuantityStrict(text) {
        return extractSolutionQuantityInfo(text).quantity;
    }

    function extractExplicitTotalQuantity(text) {
        const s = stripInternalGridCounts(extractSolutionTitleText(text));
        if (!s) return null;
        const units = QUANTITY_UNIT_PATTERN;
        const match = s.match(new RegExp(`(?:共|总计|合计|一共|总共)\\s*(\\d+(?:\\.\\d+)?)\\s*${units}`, 'i'));
        return match ? parseFloat(match[1]) : null;
    }

    function sumAiComponentQuantities(components) {
        if (!Array.isArray(components) || components.length < 2) return null;
        const values = components.map(component => parseQuantityValue(component?.quantity)).filter(value => isFinite(value) && value > 0);
        return values.length === components.length ? values.reduce((sum, value) => sum + value, 0) : null;
    }

    function isUnreliableAiQuantitySource(value) {
        const source = safeString(value).trim().toLowerCase();
        return /图片|图像|视觉|推测|猜测|image|visual|inferred|guess/.test(source);
    }

    function extractSolutionTitleText(text) {
        const raw = safeString(text).trim();
        if (!raw) return '';
        return raw
            // 删除每个【SKU分项】内部自己的补充备注，但保留“】 + 下一个SKU【”之后的方案。
            // 原逻辑从第一个“补充备注”起截断整段文本，导致后续SKU无法识别为组件。
            .replace(/[+＋]?\s*补充备注\s*[：:][^】\]]*(?=[】\]])/gi, '')
            // 不在方括号内的备注只删除到下一个明确SKU分项；不能把后续“+ LIC4210:...”一并截掉。
            .replace(/[+＋]?\s*补充备注\s*[：:][\s\S]*?(?=(?:[+＋]\s*(?:\d{8,}|[A-Za-z]{1,12}[A-Za-z0-9-]*\d[A-Za-z0-9-]*)\s*[：:])|$)/gi, '')
            .replace(/[+＋]\s*$/, '')
            .trim();
    }

    function shouldDisplayComponentsFromSolutionText(sourceText) {
        return extractExplicitComponentDefinitions(sourceText).length >= 2;
    }
    
    function sizeUnitFactorToCm(unit) {
        const normalized = safeString(unit).trim().toLowerCase().replace(/[.。\s]/g, '');
        if (!normalized) return 1;
        if (['mm', '毫米', 'millimeter', 'millimeters'].includes(normalized)) return 0.1;
        if (['cm', '厘米', '公分', 'centimeter', 'centimeters'].includes(normalized)) return 1;
        if (['m', '米', '公尺', 'meter', 'meters'].includes(normalized)) return 100;
        if (['in', 'inch', 'inches', '英寸', '"', '″', "''"].includes(normalized)) return 2.54;
        if (['ft', 'foot', 'feet', '英尺', "'", '′'].includes(normalized)) return 30.48;
        if (['yd', 'yard', 'yards', '码', '码数'].includes(normalized)) return 91.44;
        return 1;
    }

    function convertToCm(input, fallbackUnit = '') {
        if (input === null || input === undefined) return null;
        if (typeof input === 'number') return Number.isFinite(input) ? input * sizeUnitFactorToCm(fallbackUnit) : null;
        const str = String(input).trim();
        if (!str) return null;
        const match = str.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*([a-zA-Z"'″′\u4e00-\u9fff]*)\s*$/);
        if (!match) return null;
        const value = parseFloat(match[1]);
        if (!Number.isFinite(value)) return null;
        const explicitUnit = match[2] || fallbackUnit;
        return value * sizeUnitFactorToCm(explicitUnit);
    }

    function normalizeMixedUnitSizeFromSolutionText(sizeObj, sourceText) {
        const source = extractSolutionTitleText(sourceText);
        if (!source) return sizeObj;
        const unitToken = '(mm|毫米|cm|厘米|公分|m|米|inches|inch|in|英寸|ft|feet|foot|英尺|yd|yards|yard|码)';
        const mixedPattern = new RegExp(
            `(\\d+(?:\\.\\d+)?)\\s*${unitToken}\\s*[x×X*]\\s*(\\d+(?:\\.\\d+)?)\\s*${unitToken}(?:\\s*[x×X*]\\s*(\\d+(?:\\.\\d+)?)\\s*${unitToken})?`,
            'i'
        );
        const match = source.match(mixedPattern);
        if (!match) return sizeObj;
        const dimensions = [
            { value: parseFloat(match[1]), unit: match[2] },
            { value: parseFloat(match[3]), unit: match[4] }
        ];
        if (match[5] && match[6]) dimensions.push({ value: parseFloat(match[5]), unit: match[6] });
        if (dimensions.some(item => !Number.isFinite(item.value) || item.value <= 0)) return sizeObj;
        const factors = dimensions.map(item => sizeUnitFactorToCm(item.unit));
        if (new Set(factors).size < 2) return sizeObj;
        const valuesCm = dimensions
            .map((item, index) => item.value * factors[index])
            .sort((a, b) => b - a)
            .map(value => Math.round(value * 100) / 100);
        const normalized = { length: valuesCm[0], width: valuesCm[1], unit: 'cm' };
        if (valuesCm.length > 2) normalized.height = valuesCm[2];
        return normalized;
    }
    
    const dimensionMap = {
        'length': 'length', 'long': 'length', '长': 'length',
        'width': 'width', 'wide': 'width', '宽': 'width',
        'height': 'height', 'high': 'height', '高': 'height',
        'diameter': 'diameter', 'dia': 'diameter', '直径': 'diameter'
    };
    
    function calcSizeDiffStructured(bObj, uObj) {
        if (!bObj || !uObj) return { diff: null, reason: '未识别', details: [], weightedDetails: [] };
        let normBuilt = {}, normUnbuilt = {};
        const bUnit = bObj.unit || bObj.单位 || '';
        const uUnit = uObj.unit || uObj.单位 || '';
        
        for (let key in bObj) {
            const normKey = dimensionMap[key.toLowerCase()] || key;
            if (normKey === 'unit' || normKey === '单位') continue;
            const val = convertToCm(bObj[key], bUnit);
            if (val !== null && val > 0) normBuilt[normKey] = val;
        }
        for (let key in uObj) {
            const normKey = dimensionMap[key.toLowerCase()] || key;
            if (normKey === 'unit' || normKey === '单位') continue;
            const val = convertToCm(uObj[key], uUnit);
            if (val !== null && val > 0) normUnbuilt[normKey] = val;
        }
        const builtKeys = Object.keys(normBuilt), unbuiltKeys = Object.keys(normUnbuilt);
        if (builtKeys.length === 1 && unbuiltKeys.length > 1) {
            const singleKey = builtKeys[0];
            const bestKey = unbuiltKeys.find(k => k === singleKey) || unbuiltKeys.find(k => k.includes(singleKey) || singleKey.includes(k)) || (unbuiltKeys.includes('length') ? 'length' : unbuiltKeys[0]);
            normUnbuilt = { [bestKey]: normUnbuilt[bestKey] };
        }
        if (unbuiltKeys.length === 1 && builtKeys.length > 1) {
            const singleKey = unbuiltKeys[0];
            const bestKey = builtKeys.find(k => k === singleKey) || builtKeys.find(k => k.includes(singleKey) || singleKey.includes(k)) || (builtKeys.includes('length') ? 'length' : builtKeys[0]);
            normBuilt = { [bestKey]: normBuilt[bestKey] };
        }
        const allKeys = new Set([...Object.keys(normBuilt), ...Object.keys(normUnbuilt)]);
        let totalWeight = 0, weightedDiffSum = 0;
        let hasValidDim = false;
        const details = [], weightedDetails = [];
        for (let key of allKeys) {
            const bVal = normBuilt[key], uVal = normUnbuilt[key];
            if (bVal === undefined || uVal === undefined || bVal === 0) continue;
            hasValidDim = true;
            const diffCm = Math.abs(uVal - bVal);
            const diffPercent = diffCm / bVal * 100;
            details.push({ key, built: bVal, unbuilt: uVal, diffCm, diffPercent });
            totalWeight += bVal;
            weightedDiffSum += diffPercent * bVal;
            weightedDetails.push({ key, built: bVal, unbuilt: uVal, diffPercent, weight: bVal });
        }
        if (!hasValidDim) return { diff: null, rawDiff: null, reason: '未识别', details: [], weightedDetails: [] };
        const weightedAvgDiff = totalWeight > 0 ? weightedDiffSum / totalWeight : 0;
        let allDimsBelowThreshold = true;
        for (let d of details) { if (d.diffCm >= 4) { allDimsBelowThreshold = false; break; } }
        if (weightedAvgDiff < 4 && allDimsBelowThreshold) return { diff: null, rawDiff: weightedAvgDiff, reason: '微小', details, weightedDetails };
        return { diff: weightedAvgDiff, rawDiff: weightedAvgDiff, reason: null, details, weightedDetails };
    }

    // Specific compound materials must precede broader keywords such as glass, PVC, paper and leather.
    const materialCategories = {
        '复合材料': ['玻璃纤维布', '碳纤维布', '玻璃纤维', '玻纤', '碳纤维', '碳纤', '玻璃钢', 'FRP', '复合材料'],
        '纸类': ['牛皮纸', '木浆纸', '铜版纸', '瓦楞纸', '卡纸', '纸浆', '纸'],
        '皮革': ['真皮', '皮革', '牛皮', '羊皮', 'PU皮', '人造革', '合成革', '仿皮'],
        '天然编织': ['藤编', '柳编', '海草', '稻草', '拉菲草', '玉米皮', '藤'],
        '泡沫/海绵': ['记忆棉', 'EVA', 'EPE', 'EPS', 'XPE', '泡沫', '海绵', '发泡材料'],

            }
            if (rawValues.length === 0) {
                for (let key in sizeObj) {

            if (rawValues.length === 0) return '-';

    function extractTextQuantityForComponent(componentName, sourceText) {
        const source = stripInternalGridCounts(sourceText);

        const quantityPattern = new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${QUANTITY_UNIT_PATTERN})`, 'i');
        let position = compactName ? compactSource.indexOf(compactName) : -1;
        if (position < 0) {
            const genericTokens = new Set(['产品', '组件', '配件', '颜色', '尺寸', '材质', '款式', '套装', '主体', '主品']);
            const tokens = (name.match(/[\u4e00-\u9fa5]{2,}|[a-zA-Z]{2,}/g) || []).filter(token => !genericTokens.has(token)).sort((a, b) => b.length - a.length);

        if (position < 0) return null;
        const before = compactSource.slice(Math.max(0, position - 18), position);
        const after = compactSource.slice(position + compactName.length, position + compactName.length + 18);
        const beforeMatch = before.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*${QUANTITY_UNIT_PATTERN}\\s*$`, 'i'));

            return aiComponents.map((component, index) => ({

                quantity: parseQuantityValue(component?.quantity) || 1
            }));
        }
        const usedIndexes = new Set();
        const compactName = value => safeString(value).toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]/g, '');
        const findMatchingAiComponent = definition => {
            const target = compactName(definition.name);
            if (!target) return -1;
            let bestIndex = -1;
            let bestScore = 0;
            aiComponents.forEach((component, index) => {
                if (usedIndexes.has(index)) return;
                const candidate = compactName(component?.name);
                if (!candidate) return;
                let score = 0;
                if (candidate === target) score = 100;
                else if (candidate.includes(target) || target.includes(candidate)) score = 80;

                    score = tokens.filter(token => candidate.includes(compactName(token))).length * 10;
                }
                if (score > bestScore) { bestScore = score; bestIndex = index; }
            });
            return bestScore >= 10 ? bestIndex : -1;
        };
        return definitions.map((definition, index) => {
            const matchedIndex = findMatchingAiComponent(definition);
            if (matchedIndex >= 0) {

    function parseDoubaoErrorMessage(rawText, status, requestBytes) {
        let detail = '';
        try {
            const parsed = JSON.parse(rawText || '{}');
            detail = safeString(parsed?.error?.message || parsed?.message || parsed?.error?.code || parsed?.code);
        } catch (e) {
            detail = safeString(rawText).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        }
        detail = detail.slice(0, 300);
        const sizeMb = (requestBytes / 1024 / 1024).toFixed(1);
        if (status === 400 && !detail) detail = `请求参数或图片不符合接口要求，请求大小约${sizeMb}MB`;
        if (status === 401 || status === 403) detail = detail || 'API密钥或模型端点无权限';
        if (status === 413) detail = detail || `图片或请求体过大，请求大小约${sizeMb}MB`;
        if (status === 429) detail = detail || '请求过于频繁或接口额度不足';
        if (status >= 500) detail = detail || '豆包服务暂时异常';
        return `豆包请求失败（${status}）：${detail || '接口未返回具体原因'}`;
    }

    async function fetchDoubao(reqBody, maxAttempts = 3) {
        const body = JSON.stringify(reqBody);
        const requestBytes = new Blob([body]).size;
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            try {
                const resp = await fetch(DOUBAO_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DOUBAO_API_KEY}` },
                    body
                });
                if (resp.ok) return resp;
                const rawError = await resp.text();
                const retryable = [408, 429, 500, 502, 503, 504].includes(resp.status);
                if (!retryable || attempt === maxAttempts - 1) {
                    throw new Error(parseDoubaoErrorMessage(rawError, resp.status, requestBytes));
                }
            } catch (error) {
                const isDetailedApiError = /^豆包请求失败（\d+）/.test(safeString(error?.message));
                if (isDetailedApiError || attempt === maxAttempts - 1) throw error;
            }
            await sleep(800 * Math.pow(2, attempt));
        }
        throw new Error('豆包请求失败：未知错误');
    }

    async function optimizeImageForDoubao(dataUrl, maxSide = 1800, maxEncodedBytes = 3.5 * 1024 * 1024) {
        const source = safeString(dataUrl);
        if (!source.startsWith('data:image/')) throw new Error('图片数据无效，请重新上传');
        if (aiImageCache.has(source)) return aiImageCache.get(source);
        if (aiImageCache.size >= 24) aiImageCache.delete(aiImageCache.keys().next().value);
        const task = new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                try {
                    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
                    const width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
                    const height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d', { alpha: false });
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    let quality = 0.88;
                    let optimized = canvas.toDataURL('image/jpeg', quality);
                    while (optimized.length > maxEncodedBytes && quality > 0.58) {
                        quality -= 0.10;
                        optimized = canvas.toDataURL('image/jpeg', quality);
                    }
                    if (!optimized || optimized === 'data:,') throw new Error('图片压缩失败');
                    resolve(optimized);
                } catch (error) {
                    reject(new Error(`图片处理失败：${error.message || '无法读取图片'}`));
                }
            };
            img.onerror = () => reject(new Error('图片读取失败，请重新粘贴或上传图片'));
            img.src = source;
        });
        aiImageCache.set(source, task);
        try {
            return await task;
        } catch (error) {
            aiImageCache.delete(source);
            throw error;
        }
    }

        const noMetaComment = '\n不要输出纠偏过程、内部规则说明或模型自我评价，只输出用户可读的分析结果。';
        const competitionFocusRule = '\n**竞争分析聚焦约束**：沿用原版上架竞争程度分析口径，只分析两个产品之间的直接竞争关系和细分市场差异。竞争程度看核心功能、使用场景、替代关系和受众重叠；细分市场差异看目标风格、节日体系、语言/宗教属性、特殊人群、固定主题与可替换主题体系等是否形成稳定区隔。细分市场差异“较大”表示存在明确且稳定的目标客群或需求边界；“较小”表示只有有限偏好差异，客群和需求仍高度重叠；“无明显差异”表示未形成有效细分区隔。若一款为固定垂直主题，另一款为跨节日可替换体系，且由此面向明显不同的装饰风格或需求方向，应判为较大，不得先写较小再说客群差异明显。较高竞争与较大细分差异不是绝对互斥，但若同时出现，必须统一写成“核心功能和基础使用/摆放场景重合，因此具有较强替代关系；但购买动机、主题需求、目标风格或特定人群存在稳定边界，因此细分市场差异较大”。此时禁止在竞争分析中写“使用场景重叠”，又在细分市场分析中写“消费场景完全不同、截然不同或毫无重合”；可以写节庆装饰与日常展示的具体需求侧重点不同，但必须承认两者仍共享基础陈列/使用场景。禁止分析市场供给量、竞品数量等宏观状况；禁止写搜索词、关键词、搜索结果、搜索路径、购买决策、购买意图等内容。详细分析不要重复“图案差异度多少、是否低于50%、综合差异度多少、通过/不通过”等界面已有信息。';
        const globalMarketPassRule = '\n**全局市场放行规则**：当上架竞争程度为较低竞争或无竞争，并且细分市场差异为较大时，该对比组可以通过。此规则适用于普通对比、组合产品、首创保护期内、首创保护期外以及保护期外首创与其他已建产品的对比；不得因为数量、尺寸、款式/图案或保护期外维度规则未达标而否定该市场放行条件。竞争程度与细分市场差异必须按真实产品关系独立分析，不得为了通过而人为降低竞争等级或抬高细分市场差异。';
        const redesignDirectionRule = '\n**基于Amazon市场特性的改款方向**：仅当款式/图案差异度overall_percent<50%时生成改款方向；overall_percent≥50%时amazon_redesign_direction必须返回空字符串。最多输出3条，每条单独换行。建议必须针对未建产品本身提出可执行改法，包括主题图案、核心造型、结构部件、产品形态、套装结构、安装方式、材质/工艺、功能场景、适用人群等；不要只给关键词差异，不要只建议改颜色、改数量、轻微改尺寸或改表面纹路。若产品已有明确节日/宗教主题，不要建议切换到其他节日，只能在同一主题内调整。改款方向不要提及已建、竞品或相比已建。';
        const imageQuantityRule = '\n**产品方案标题数量唯一来源**：built_quantity、unbuilt_quantity 以及组件 quantity 只能依据用户输入的产品方案标题识别。标题后的“补充备注”及其后所有打包、仓库、出货、每袋、每版、供应商包装数字都不属于产品/配件数量。禁止根据审核图中看见几个产品、图片标签、箭头标注、层数、格数、孔数、展示位数、支撑杆数、网格数或其他视觉信息擅自推断数量。图片只能用于识别真实款式和结构，不能补充或覆盖标题数量，也不能决定是否拆分组件。若标题没有明确写出销售数量，built_quantity/unbuilt_quantity 必须默认为1；若组合标题只写“1套/1组/1包”等整体单位而未使用“+”逐项列出组件，则不输出组件列表，整套作为一个整体展示。若标题明确写成“N个/件/只/条等 + 1套/一套”，例如“6个1套”，数量必须取前面的实际产品数N，不能只取末尾的1套。使用“+”时按加号逐项识别组件；总数量先取明确写出的“X套/X组”主产品分项，其次取主产品数量。盖子、吸管、杯盖、盘子、包装等配件数量不参与总数量相加。只有完全无法识别主产品且各分项地位相同、数量也相同的情况下，才取共同数量；数量不一致且无法判断主次时，默认为1，禁止直接求和。某分项未明确数量时，该组件 quantity 默认为1。款式数不是销售数量；“共N款/种图案，每款/每种M个/件”必须识别为总数量N×M，不能只输出N；内部格子/网格/分区数量不是销售数量；一包200张/200张一包等标题中的产品包装销售数量优先识别为实际数量。尺寸数字不得识别为数量。';
        const skuBundleRule = '\n**多SKU组合与补充备注规则**：SKU【主产品 + 补充备注】中，补充备注只说明打包、出货、仓库包装或一版多少个，不得覆盖主产品数量，也不得吞掉补充备注之后通过“+ 下一个SKU编号”继续列出的产品。混合单位套装不得强行合计成单一单位；标题有“+”时按分项展示并分别识别数量，标题只写“1套/1组/1包”且没有“+”时直接作为一个整体方案展示。';
        const productSizeRule = '\n**产品尺寸与包装尺寸区分**：包装、出货、安全包装、体积、仓库、防摔测试、外箱、箱规等语境中的尺寸是包装/运输尺寸，不得填入产品本体尺寸。';
        const imageTextConsistencyRule = '\n**图上文字与真实款式识别规则**：产品图片中的文字说明、红字标注、箭头、尺寸线、局部放大图、材质说明、款式说明、结构说明均属于产品方案信息，必须结合视觉主体识别真实款式。若图片文字说明按左图款式/参考上图/采用某结构，必须把被引用整体图作为主体结构，局部图只作细节补充。若图片红字/标注/箭头写“改成/定制/采用/做成/换成/使用右边图案/定制右边图案/参考右边图案/按右图图案”，必须按文字指定的最终成品图案进行识别；左侧或背景图若只是管身、结构、材质或颜色参考，不得把其旧表面图案当成最终图案。若图片或文字写“参考颜色/参考材质/参考色号/参考效果/参考某图做成品”，该参考图只用于提取颜色、材质、工艺或效果，不能自动把参考图里的物品识别为组件；参考图中的物品只有在产品方案使用“+”逐项列出时，才可作为组件展示。';
        const majorMaterialCategoryText = '复合材料、纸类、皮革、天然编织、泡沫/海绵、软塑料/薄膜、硬塑料、树脂、金属、木材、硅胶/橡胶、蜡质、石材/矿物、陶瓷、布艺、玻璃';
        const materialEvidenceRule = `\n**主体材质与证据来源规则**：built_material/unbuilt_material 只输出主售卖产品本体的主体材质，不得用手柄、内衬、挂绳、底座、包装、标签或其他配件材质代替主体材质。组合产品先识别承担核心用途的主产品，再提取其主体材质。material_source.built和material_source.unbuilt只能输出“方案文字”“图片文字”“视觉推测”“未知”之一：用户产品方案明确写出材质时为“方案文字”；审核图中存在清晰可读的材质标注时为“图片文字”；仅根据外观、透明度、反光、纹理或模型常识判断时为“视觉推测”；没有可靠信息时为“未知”。首创材质大类直接通过只允许使用两侧均为“方案文字”或“图片文字”的主体材质；任何一侧为“视觉推测”或“未知”均不得按材质直接通过。主体材质按以下大类归类：${majorMaterialCategoryText}。硅胶/橡胶与亚克力等硬塑料属于材质大类差异；软PVC、PVC软胶、PVC薄膜、PE膜、LDPE、TPU等归入软塑料/薄膜，不得误归入硬塑料；树脂单独归类，不得归入硬塑料。仅输出主产品实际承担主体结构或核心用途的材质；混合材质、复合描述但无法确定主体材质、无法归类的材质均不得作为材质大类直接通过依据。`;
         const primaryAccessoryRule = '\n**主品与配件权重规则**：组合产品必须先识别主售卖产品和附属配件。主售卖产品决定核心图案差异、竞争程度和可替代性；总数量和配件数量仍必须严格取产品方案标题中的明确数字，标题未明确时默认为1。补充备注和图片数字不得覆盖标题数量。花插、贺卡、卡纸、丝带、缎带、手提袋、包装纸、贴纸、点胶、卡片、标签、欧根纱袋、绒布袋、礼袋、透明袋、勺子、叉子、餐具、夹子、擦手巾、毛巾、抹布、餐巾、造雾器、雾化器、适配器、水架、支架、底座、电源、遥控器、充气泵、连接线、挂绳等附属/功能配件只有在标题使用“+”明确列出时才作为子件展示，不得计入 built_quantity/unbuilt_quantity 的总数量，也不得单独把整体图案差异或综合差异抬高到≥50。标题有“+”时按加号展示组件；标题只有“1套/1组/1包”等整体单位且没有“+”时，整套作为一个整体展示。若组合中存在菜板/托盘/篮子/桶/灯/地毯/挂布/摆件/花环/清洁液/清洁剂/清洁喷雾等明显承载核心用途的主体件，只用于识别主品和视觉权重，不得覆盖产品方案标题数量。';

            : `\n**非首创对比颜色规则（最高优先级；覆盖前文“颜色只能辅助、单独改色不得达到50%”等限制）**：颜色目视化差异是有效的图案差异组成部分。即使两款的款式、轮廓、图案版式和结构完全一致，只要产品主体大部分可见面采用明显不同的主色体系，第一眼形成强烈且稳定的视觉区分，overall_percent允许直接达到50%并按图案差异通过。此时颜色只计入visual_overall_percent，不得虚构shape_contour、pattern_decoration或structure_parts差异；最终overall_percent可执行“大面积强色差触发”，不受普通四维加权结果低于50%的限制。强色差必须来自产品本身，并同时满足：主色覆盖主体大部分可见区域；两套主色在色相、明度或冷暖上有明显反差；不是拍摄光线、白平衡、滤镜、阴影、背景或显示偏色造成；不是仅提手、包边、文字、小配件等小面积点缀色变化。大面积红白与绿白、黑白与浅色、深色与高明度浅色等能够改变第一视觉识别的配色，可判50%；只有轻微深浅、近似色、局部点缀色或低覆盖率换色时，不得触发50%。若除强色差外还存在格纹尺度、排列节奏、荷叶边、装饰位置或表面图案等真实变化，可在50%基础上按实际增加；不得因为款式相同再把结果压回50%以下。`;
