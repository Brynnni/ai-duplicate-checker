        const componentRule = '\n**组件拆分与命名严格限制**：产品方案使用“+”号明确连接多个产品/部件时，按加号逐项拆分；如果没有“+”，但方案在同一标题中使用逗号、顿号或分号列出至少两个独立产品，且每个分项都明确写出数量（包括“产品*数量”写法），也必须按分项拆分并分别展示。例如“红色大号蝴蝶结*1，充气桔彩圣诞球*3，红色圣诞球*24个”应展示3个组件，数量分别为1、3、24。括号内的颜色、尺寸、材质、款式和备注逗号不属于组件分隔符；但当顶层名称本身只是“配件、附件、材料包、辅料包、零件包、装饰包、工具包”等总称，且括号内使用“+”明确列出至少两个真实产品名称和各自数量时，必须用内部真实子件替换该总称并逐项展示。例如“海洋配件3个（3.5-4cm贝壳1个+4cm面包海星1个+5cm面包海星1个）”应拆成3个子件；若父项以“3个”等数字计数，内部数量合计必须与父项一致，否则不要拆。只有明确数量的顶层分项或满足上述条件的总称内部子件才可拆分；普通属性罗列、单个整体产品的装饰细节、只写“1套/1组/1包”且没有明确子件名称和数量时不得拆分。某顶层分项没有明确数量时，该组件 quantity 默认为1。components必须与方案分项一一对应，数量和排列顺序必须完全一致。每个component.name必须直接提取对应分项里的真实产品名称，只删除SKU编号/日期编号、销售数量和括号内颜色尺寸材质等属性，不得根据图片颜色或视觉概括自行改名；禁止输出“棕色系产品”“粉色产品”“某色产品”“产品1”“组件1”“配件”“套装单品”等泛化名称。例如方案中的分项应保留为“仿真绿植花朵鹿角发箍”“亮片半身裙”“毛绒鹿尾巴”“袖套”“腿套”。产品方案只写“1套/1组/1包”等整体售卖单位、没有明确分项数量时，必须把整套直接作为一个整体展示，数量为1，不得根据审核图片中看到的多个独立物品拆分，即使图片明显展示多个组件也不能拆分。产品名称或描述中的“带/含/有/配有”如果只是说明主体上的装饰、结构或工艺，不代表独立组件。窗帘、罩帘、遮挡帘、微波炉罩、防尘罩、桌布、地毯、挂布、服装、包袋等整体成品中的花边、蕾丝边、蝴蝶结、绑带、流苏、滚边、褶皱、拼接布、印花、刺绣、口袋、提手、边框、装饰条都属于主体的一部分，不得拆成 components，也不得参与总数量。1套/1组/1包是整体售卖单位；图片、图片文字、标注、层数、格数和视觉计数不能改变整体展示规则。参考颜色、参考材质、参考效果的图片不得单独产生组件。';
        const sizeFormatRule = '\n**尺寸格式与单位换算约束**：built_size/unbuilt_size/components.size 必须为JSON对象，如 {length:20,width:10,height:5,unit:"cm"}。所有尺寸在输出JSON前必须逐个换算成厘米，数值必须是换算后的纯数字，unit固定输出cm；禁止输出ft/in、in/ft、cm/in等混合总单位。遇到“17 in × 32.8 ft”这类各边单位不同的尺寸，必须分别换算为43.18cm和999.74cm，再按实际长边、宽边对应输出为 {length:999.74,width:43.18,unit:"cm"}，不能把两个原始数字共用同一个单位，也不能直接用17和32.8参与比较。无明确长宽标签的二维/三维尺寸，换算后按数值从大到小依次映射为length、width、height，避免因书写顺序不同造成错位；有明确长/宽/高标签时按标签映射。无法识别尺寸时返回空对象。';
        const quantityUnitRule = `\n**数量量词兼容**：数量不只使用“个/件/套”。紧邻产品名称或明确总数的常见量词都必须识别，例如：${QUANTITY_UNITS.join('、')}。但格数、层数、孔数、行列数等仅描述产品内部结构时，不得当成销售数量；存在明确产品销售数量时以销售数量为准。`;
        const pairRule = '\n**成对物品数量规则**：手套、袜子、袖套、耳环等通常成对销售的物品，除非明确单只，否则按1双/1套/1对计数。';
        const mappingRule = '\n**图文组件对应流程**：将产品方案文字中的组件与图片中的对应主体一一核对，用于确认组件名称、真实款式和结构；组件对应结果仅用于产品信息展示，不单独参与通过/不通过或置信度判断。';
        const dimensionDetailRule = '\n**四个视觉维度输出要求**：visual_overall、shape_contour、pattern_decoration、structure_parts 只能分析产品本身的款式、外形轮廓、图案装饰、纹理语言、结构部件和版式构图。四个字段均必须忽视数量、件数、套装数量、尺寸、规格、大小、多尺寸组合、拍摄角度、展示角度、单个/多个展示、叠放/摆放方式、包装和出货方式；颜色、配色、色彩只能写入整体目视化差异，不得写入形状与轮廓、图案与装饰、结构与部件三个维度，颜色对最终差异度的有效性严格按当前首创/非首创颜色规则执行；禁止写“未建4个、已建1个所以差异明显”“多尺寸套装与单个产品差异明显”等把非图案因素当成视觉维度依据的表述。如果两边只是数量/尺寸/展示方式不同，而碗口形态、主体轮廓、棋盘格图案、装饰位置、结构部件一致或高度相似，应在四个维度中写差异较小或高度相似；如果仅颜色不同，整体目视化必须如实描述色彩覆盖范围和视觉反差，其他三个维度仍按款式/图案/结构本身判断。不能只写“差异较大/差异明显/无差异/差异较小”这类等级词。每个文字字段用一句自然表达说明“差异程度 + 具体款式/图案依据”，同时必须输出对应的分项百分比字段；但文字字段本身禁止出现任何百分比、分值、权重、占比、分项占比、对应分项占比、对应分项百分比、该项XX%、XX分等内部计算信息，百分比只能放在 visual_overall_percent、shape_contour_percent、pattern_decoration_percent、structure_parts_percent 和 overall_percent 字段里。不要写“依据是/原因是/主要依据是”这类套话。例如直接写“差异较小，二者均为敞口碗形主体并采用棋盘格外壁装饰，仅碗口比例或局部细节略有区别”。';
        const summaryRule = '\n**summary字段约束**：summary 是“图案差异度总结性分析”，输出2-3句分析型总结。必须围绕款式、外形、图案、装饰、纹理、结构和当前模式允许计入的颜色目视化差异，说明为什么给出该图案差异度；不得把数量、件数、套装数量、尺寸、规格、大小、多尺寸组合、拍摄角度、展示角度、单个/多个展示、叠放/摆放方式、包装和出货方式作为差异依据。颜色只能归入整体目视化，不得作为图案装饰、形状轮廓或结构部件差异依据；非首创强色差可按模式规则成为达到50%的有效依据，首创不得使用颜色抬分。可以归纳上方四个视觉维度的关键结论，但不要逐项机械复述“整体目视化、形状轮廓、图案装饰、结构部件”。summary、四个视觉维度和 overall_percent 必须使用同一套差异等级口径，不能前面写差异明显/差异较大，后面又写中等偏小/差异较小，也不能百分比很高但文字结论偏低；如果overall_percent低于50，禁止出现“整体视觉差异较为明显/明显/差异较大/区分度较明确”等高差异表达。summary 禁止出现受众、人群、使用场景、场景、市场、Amazon、亚马逊、竞争、关键词、上架、消费者、需求、用途、功能、是否可替代等内容。';
        const auditRemarkDifferenceRule = '\n**审核备注差异类型判定**：“款式”仅指产品本体的外形、轮廓和造型特征；“图案设计”仅指产品表面的印花、图文、版式、装饰图形和纹样设计。必须分开判断并输出audit_style_shape_diff、audit_pattern_design_diff两个布尔值。外形一致、仅表面图案设计不同时，audit_style_shape_diff=false、audit_pattern_design_diff=true；仅外形不同时为true/false；外形和图案设计都不同时才为true/true。不得因为颜色、数量、尺寸、拍摄角度、摆放方式、背景或包装不同将任一字段判为true。只有该类差异真实存在且足以在最终审核备注中单独概括时才输出true。';
        const uncertaintyRule = '\n**置信度证据字段（只报告事实，不得计算或输出置信度）**：quantity_source必须分别报告built与unbuilt的初始数量来源，只允许“文字、图片、推测、未知”；产品方案标题明确写出数量时为“文字”，方案未明确数量且系统应默认1时为“未知”，不得把图片计数或推测数量伪装成文字来源。size_uncertain 仅在尺寸文字、单位、对应关系或图片标注无法可靠确认时为true；components_uncertain 仅在组合边界、主配件关系或组件对应无法可靠确认时为true；image_quality只能输出good/fair/poor，图片模糊、遮挡严重、分辨率过低或主体不可辨时输出poor；uncertainty_reasons用简短数组列出实际不确定点，无不确定点时输出空数组。不得把“差异接近50%”写成识别不确定，那由系统另行计算。不得输出confidence、置信度分数或高/中/低档位。';
        const protectionOutsideFieldsRule = '\n**保护期外辅助字段**：color_difference_percent独立输出两款主售卖产品本身的颜色目视化差异度0-100，只判断主体大面积主色、色彩体系和稳定视觉反差，忽略光线、白平衡、阴影、背景、滤镜和小面积点缀色；首创对比中该值不得并入overall_percent。';
         let prompt = `对比已建与未建产品图片及文字。产品方案文字是数量的唯一来源；即使图片中展示或标注了其他数字，也不得用图片数字补充数量，方案没有明确数量时数量默认为1。${marketHint}${consistencyRule}${noMetaComment}${competitionFocusRule}${globalMarketPassRule}${redesignDirectionRule}${imageQuantityRule}${skuBundleRule}${productSizeRule}${imageTextConsistencyRule}${materialEvidenceRule}${primaryAccessoryRule}${appearanceDiffRule}${humanAlignedAppearanceRule}${comparisonModeColorRule}${comprehensiveDiffRule}${componentRule}${sizeFormatRule}${quantityUnitRule}${pairRule}${mappingRule}${dimensionDetailRule}${summaryRule}${auditRemarkDifferenceRule}${uncertaintyRule}\n【组合产品数量提取规则】产品方案使用“+”号明确分项时，按加号逐项识别；没有“+”但使用逗号、顿号或分号列出至少两个独立产品，且每个顶层分项明确写出数量时，也必须逐项识别。例如“红色大号蝴蝶结*1，充气桔彩圣诞球*3，红色圣诞球*24个”应识别为1、3、24三个组件。括号内颜色、尺寸、材质、款式和备注中的逗号不能拆分组件。只写“1套/1组/1包”且没有明确分项数量时，整套作为一个方案展示，数量为1，即使图片中有多个独立物品也不得拆分。有多个组件时，先取明确写出的“X套/X组”主产品分项，其次取主产品数量；盖子、吸管、杯盖、盘子、包装等配件不参与总数量相加。例如“30个杯子+30个盖子+1个盘子+10个吸管”，总数量应为30，不是71。只有完全无法识别主产品且各分项地位相同、数量也相同的情况下，才取共同数量；数量不一致且无法判断主次时默认为1，禁止直接求和。最终数量不得回退到图片、AI视觉计数或补充备注数字。若标题只是描述单个整体产品自带的花边、蕾丝、蝴蝶结、绑带、装饰边、印花、刺绣、口袋、提手、滚边、褶皱等结构/装饰细节，不得把这些细节拆成组件相加。卡片、袋子、包装、标签、贴纸、点胶、丝带、勺子、叉子、夹子、擦手巾、毛巾、造雾器、雾化器、适配器、水架、支架、底座、电源、遥控器、充气泵、连接线等配件只在允许展示 components 时列出，不参与总数量相加。${priceInfo}\n竞争程度分5级：高度/较高/一般/较低/无竞争。细分市场差异分析必须以“细分市场差异：较大/较小/无明显差异”开头。\n任务：提取描述、数量、尺寸、颜色、材质、成本水平和组件列表；总结功能用途、人群场景；必须先识别核心设计载体，再分别对“整体目视化差异、形状与轮廓、图案与装饰、结构与部件”写明差异程度和具体依据，并分别输出分项百分比；按照核心设计载体使用对应权重计算基础分，再执行核心差异触发规则和当前对比模式颜色规则得到overall_percent；summary只输出图案差异度总结；单独判定审核备注中的款式外形差异和图案设计差异；只报告证据不确定字段，不得自行计算置信度；输出overall_percent、竞争程度、细分市场差异和 Amazon 改款方向。`;

    resetBtn.addEventListener('click', () => { searchInp.value = ''; renderRecordsList(''); });
    clearBtn.addEventListener('click', async () => { if (confirm('确定清空所有记录？')) await clearHistory(); });
    searchInp.addEventListener('keypress', e => { if (e.key === 'Enter') renderRecordsList(searchInp.value); });
    document.getElementById('confidenceFilter')?.addEventListener('change', () => renderRecordsList(searchInp.value));
    document.getElementById('confidenceSort')?.addEventListener('change', () => renderRecordsList(searchInp.value));
    const qaBtn = document.getElementById('qaAskBtn'), qaQ = document.getElementById('qaQuestion'), qaA = document.getElementById('qaAnswer');
    qaBtn.addEventListener('click', async () => {
        const q = qaQ.value.trim();
        if (!q) { alert('请输入问题'); return; }
        qaA.style.display = 'block'; qaA.innerHTML = '🤔 思考中...'; qaA.classList.add('loading');
        try { const a = await askQuestion(q); qaA.innerHTML = a; qaA.classList.remove('loading'); }
        catch (e) { qaA.innerHTML = `回答失败：${e.message}`; qaA.classList.remove('loading'); }
    });
    qaQ.addEventListener('keypress', e => { if (e.key === 'Enter') qaBtn.click(); });
    loadHistory().catch(console.error);
})();
</script>
</body>
</html>
