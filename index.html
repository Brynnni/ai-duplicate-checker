<!DOCTYPE html>
<html lang="zh-CN">

    <style>

        .qa-header { background:#f1f5f9; padding:12px 20px; font-weight:bold; font-size:18px; border-bottom:1px solid #e2e8f0; }
        .qa-body { padding:16px 20px; }
        .qa-input-group { display:flex; gap:12px; margin-bottom:16px; }

        .product-desc-text .attr { margin-top:8px; padding-top:7px; border-top:1px solid #e2e8f0; font-size:12px; color:#475569; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }

        .qty-edit input, .size-edit input { height:20px; padding:2px 7px; border:1px solid #60a5fa; border-radius:7px; font-size:12px; color:#0f172a; background:#ffffff; font-weight:700; text-align:center; transition:border-color .15s, box-shadow .15s, background .15s; }

        .size-edit { margin-left:0; }
        .size-edit input { width:92px; text-align:left; }

        .product-desc-text .sub-items { margin-top:8px; padding-left:8px; border-left:2px solid #cbd5e1; }

        .dimension-summary { display:flex; justify-content:center; gap:16px; margin-bottom:16px; flex-wrap:wrap; }

        .diff-item { border-bottom:1px solid #e2e8f0; padding:10px 0; }
        .diff-label { font-weight:700; margin-bottom:4px; font-size:13px; }
        .diff-desc { font-size:13px; line-height:1.4; }
        .product-images-compare { display:flex; gap:16px; margin-bottom:20px; }
        .product-image-box { flex:1; text-align:center; }
        .product-image-box img { max-width:100%; max-height:200px; border-radius:12px; border:1px solid #e2e8f0; }
        .product-image-box p { margin-top:8px; font-weight:500; }
        .summary-badge { background:#e2e8f0; display:inline-block; padding:2px 8px; border-radius:20px; font-size:13px; font-weight:600; margin-right:8px; }
        .final-conclusion { background:#fef9e3; border-radius:16px; padding:12px; text-align:center; margin-top:16px; }
        .conclusion-text { font-size:24px; font-weight:800; }
        .conclusion-text.pass { color:#15803d; }
        .conclusion-text.fail { color:#b91c1c; }
        .loading { text-align:center; padding:20px; color:#2563eb; }
        .built-item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .built-item-header h4 { font-size:16px; }
        .pioneer-controls { margin-top:12px; padding-top:12px; border-top:1px solid #e2e8f0; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
        .pioneer-controls label { font-size:14px; display:inline-flex; align-items:center; gap:6px; }
        .pioneer-controls input[type="radio"] { margin:0; }
        .pioneer-controls input[type="date"], .pioneer-controls .date-part { padding:4px 8px; border-radius:8px; border:1px solid #cbd5e1; }
        .pioneer-controls .date-part { width:58px; }
        .pioneer-controls .date-year { width:76px; }
        .pioneer-controls .date-inputs { display:inline-flex; align-items:center; gap:4px; }
        .pioneer-controls select { padding:4px 8px; border-radius:8px; border:1px solid #cbd5e1; }
        .competition-level-box { background:#f0f9ff; padding:8px 12px; border-radius:12px; margin-bottom:12px; border-left:4px solid #0284c7; }
        .competition-level-box .label { font-weight:700; color:#0369a1; margin-bottom:6px; font-size:13px; }
        .competition-analysis-text { margin-bottom:12px; }
        .competition-highlights { margin:8px 0 12px; padding-left:18px; line-height:1.55; }
        .competition-highlights li { margin:4px 0; }
        .submarket-box { background:#e0f2fe; border-left:4px solid #0284c7; padding:10px 12px; border-radius:12px; margin-top:12px; }
        .submarket-box .label { font-weight:700; color:#0369a1; margin-bottom:6px; font-size:13px; }
        .submarket-box .content { font-size:13px; line-height:1.5; color:#0c4a6e; }
        @media (max-width:700px) {
            .compare-layout { flex-direction:column; }
            .product-descriptions { flex-direction:column; }
            .dimension-summary { flex-direction:column; align-items:center; }
            .record-info { flex-direction:column; align-items:flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>AI查重助手<span class="version-badge">v1.0</span></h1>
    <div class="comparison-card">
        <div class="card-header"><label>新品ID：</label><input type="text" id="newProductId" placeholder="如 2424704"></div>
        <div class="card-content">
            <div class="config-bar">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="highlight-label">已建数量：</span>
                    <select id="builtCount"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
                    <span class="blue-hint">🔹 可调整对比数量</span>
                </div>
            </div>
            <div class="compare-layout">
                <div class="unbuilt-area">
                    <div class="zone-header"><h3>📦 未建</h3></div>
                    <textarea placeholder="输入产品方案" class="text-area" id="unbuiltText"></textarea>
                    <div class="price-input"><label>💰 价格 (美元)</label><input type="number" step="0.01" id="unbuiltPrice" placeholder="如 19.99（选填）"></div>
                    <div class="dropzone" id="unbuiltDropzone">
                        <img id="unbuiltPreview" class="preview-img">
                        <div class="instructions" id="unbuiltInstructions">拖拽图片到此 或 Ctrl+V 粘贴<br><span class="upload-link" id="unbuiltUploadBtn">点击上传</span></div>
                        <button class="delete-img-btn" id="unbuiltDeleteBtn" style="display:none;">×</button>
                        <input type="file" accept="image/*" id="unbuiltFileInput" style="display:none">
                    </div>
                </div>
                <div class="built-area" id="builtArea"></div>
            </div>
            <button class="compare-btn" id="compareBtn">🔍 启动AI对比分析</button>
        </div>
    </div>
    <div class="qa-section">
        <div class="qa-header">💬 AI智能问答</div>
        <div class="qa-body">
            <div class="qa-input-group"><input type="text" id="qaQuestion" placeholder="输入您的问题，例如：炻器是否属于陶瓷材质？"><button id="qaAskBtn">提问</button></div>
            <div id="qaAnswer" class="qa-answer" style="display:none;"></div>
        </div>
    </div>
    <div class="history-section">
        <div class="history-header">
            <span>📋 查重记录</span>
            <div class="search-box">
                <input type="text" id="historySearchInput" placeholder="按新品ID搜索">
                <button id="historySearchBtn">搜索</button>
                <button id="historyResetBtn">重置</button>
                <button class="clear-history" id="clearHistoryBtn">清空记录</button>
            </div>
        </div>
        <div id="recordsList" class="records-list"></div>
    </div>
</div>
<script>
(function(){
    "use strict";

    // ---------- API 配置 ----------
    const DOUBAO_API_KEY = "fbcfcc90-d805-42a1-9424-f983f423c09a";
    const DOUBAO_ENDPOINT_ID = "ep-20260320164842-rsqff";
    const DOUBAO_URL = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";

    const DB_NAME = "AIChatHistoryDB", DB_VERSION = 2, STORE_NAME = "records", HISTORY_BACKUP_KEY = "AIChatHistoryDB_records_backup_v2";
    let historyRecords = [], db = null;

    // ---------- IndexedDB 操作 ----------
    function openDB() { return new Promise((resolve, reject) => { if (db && db.name === DB_NAME) { resolve(db); return; } const r = indexedDB.open(DB_NAME, DB_VERSION); r.onerror = e => reject(e.target.error); r.onsuccess = e => { db = e.target.result; resolve(db); }; r.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "id" }); }; }); }
    function saveHistoryBackup() {
        try {
            localStorage.setItem(HISTORY_BACKUP_KEY, JSON.stringify(historyRecords));
        } catch (e) {
            console.warn('历史记录本地备份失败', e);
        }
    }
    function loadHistoryBackup() {
        try {
            const raw = localStorage.getItem(HISTORY_BACKUP_KEY);
            const list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
        } catch (e) {
            console.warn('历史记录本地备份读取失败', e);
            return [];
        }
    }
    async function loadHistory() {
        try {
            const database = await openDB();
            const tx = database.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            let rec = await new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
            if (!rec || rec.length === 0) rec = loadHistoryBackup();
            rec.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            historyRecords = rec;
            if (historyRecords.length) saveHistoryBackup();
            renderRecordsList();
        } catch (e) {
            console.error(e);
            historyRecords = loadHistoryBackup();
            historyRecords.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            renderRecordsList();
        }
    }
    async function saveHistory() {
        saveHistoryBackup();
        try {
            const database = await openDB();
            const tx = database.transaction(STORE_NAME, "readwrite");
            const store = tx.objectStore(STORE_NAME);
            for (const r of historyRecords) store.put(r);
            await new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
        } catch (e) {
            console.error(e);
        }
    }
    async function addRecord(r) { historyRecords.unshift(r); await saveHistory(); renderRecordsList(); }
    async function updateRecord(id, upd) { const idx = historyRecords.findIndex(r => r.id === id); if (idx !== -1) { historyRecords[idx] = { ...historyRecords[idx], ...upd }; await saveHistory(); renderRecordsList(); } }
    async function clearHistory() { historyRecords = []; await saveHistory(); renderRecordsList(); }

    // ---------- 辅助函数 ----------
    function safeString(s) { return typeof s === 'string' ? s : ''; }
    function normalizeImageDataForCompare(dataUrl) {
        return safeString(dataUrl).replace(/^data:image\/[a-zA-Z0-9.+-]+;base64,/, '').replace(/\s+/g, '');
    }
    function isSameImageData(a, b) {
        const aa = normalizeImageDataForCompare(a);
        const bb = normalizeImageDataForCompare(b);
        return aa.length > 0 && aa === bb;
    }
    function forceSameImageVisualResult(res) {
        if (!res) return;
        res.overall_percent = 0;
        res.visual_overall = '两张产品图片完全一致，整体目视化无差异。';
        res.shape_contour = '两张产品图片完全一致，形状与轮廓无差异。';
        res.pattern_decoration = '两张产品图片完全一致，图案、纹理与装饰无差异。';
        res.structure_parts = '两张产品图片完全一致，结构与部件无差异。';
        res.summary = '两张产品图片完全一致，整体目视化、形状轮廓、图案装饰、结构部件均无差异，图案差异度为0%。';
        res.overlap_details = [];
        res.component_overlap_ratio = 100;
    }
    function escapeRegExp(s) { return safeString(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function formatAiText(v) {
        if (v === null || v === undefined || v === '') return '';
        if (typeof v === 'string') return v;
        if (Array.isArray(v)) return v.map(item => formatAiText(item)).filter(Boolean).join('\n');
        if (typeof v === 'object') {
            return Object.entries(v).map(([key, val]) => {
                const text = formatAiText(val);
                return text ? key + ': ' + text : key;
            }).filter(Boolean).join('\n');
        }
        return String(v);
    }
    function pickAnalysisPoint(text, label, patterns, fallback = '—') {
        const s = formatAiText(text).replace(/\s+/g, ' ').trim();
        for (let p of patterns) {
            const m = s.match(p);
            if (m && m[1]) return m[1].replace(/[。；;].*$/, '').trim();
        }
        return fallback;
    }
    function renderCompetitionHighlights(analysisText) {
        const text = formatAiText(analysisText).replace(/\s+/g, ' ').trim();
        if (!text) return '无详细分析';
        const sentences = text.split(/[。；;]/).map(s => s.trim()).filter(Boolean);
        const priority = ['关键词', '搜索', '购买意图', '可替代', '目标', '人群', '场景', '功能', '结构', '价格', '规格'];
        const picked = [];
        priority.forEach(kw => {
            const hit = sentences.find(s => s.includes(kw) && !picked.includes(s));
            if (hit && picked.length < 4) picked.push(hit);
        });
        if (picked.length < 3) {
            sentences.forEach(s => { if (picked.length < 4 && !picked.includes(s)) picked.push(s); });
        }
        return `<ul class="competition-highlights">${picked.slice(0, 4).map(s => `<li>${s}</li>`).join('')}</ul>`;
    }
    function cleanMarketAnalysisText(text, maxSentences = 4) {
        const raw = formatAiText(text).replace(/\s+/g, ' ').trim();
        if (!raw) return '';

    function recalcManualQuantityDiff(container) {

    function sumPlusSeparatedQuantities(text) {
        const s = safeString(text);

        const parts = s.split('+');
        let total = 0, count = 0;
        parts.forEach(part => {
            let seg = part.replace(/补充备注[：:].*$/g, '').replace(/供\s*\d+\s*个/g, '');
            const matches = [...seg.matchAll(/(?:白色|红色|黄色|紫色|绿色|蓝色|粉色|黑色|棕色|双绿|白绿)?\s*(\d+(?:\.\d+)?)\s*(个|件|条|把|套|片|包|支|枝|束|只|卷|张)/g)];
            if (matches.length) {

    function extractMainProductQuantityBeforeAccessory(text) {

    function convertToCm(input) {
        if (input === null || input === undefined) return null;
        if (typeof input === 'number') return input;
        let str = String(input).trim();
        if (!str) return null;
        let m = str.match(/^([\d.]+)\s*(?:''|″|英寸|inch|in)\b/i);
        if (m) return parseFloat(m[1]) * 2.54;
        m = str.match(/^([\d.]+)\s*(?:'|′|英尺|ft|foot)\b/i);
        if (m) return parseFloat(m[1]) * 30.48;
        m = str.match(/^([\d.]+)\s*(?:cm|厘米)\b/i);
        if (m) return parseFloat(m[1]);
        m = str.match(/^([\d.]+)\s*(?:mm|毫米)\b/i);
        if (m) return parseFloat(m[1]) / 10;
        m = str.match(/^([\d.]+)\s*(?:m|米)\b/i);
        if (m) return parseFloat(m[1]) * 100;
        m = str.match(/^([\d.]+)$/);
        if (m) return parseFloat(m[1]);
        return null;
    }
    
    const dimensionMap = {
        'length': 'length', 'long': 'length', '长': 'length',
        'width': 'width', 'wide': 'width', '宽': 'width',
        'height': 'height', 'high': 'height', '高': 'height',
        'diameter': 'diameter', 'dia': 'diameter', '直径': 'diameter'

    function calcSizeDiffStructured(bObj, uObj) {
        if (!bObj || !uObj) return { diff: null, reason: '未识别', details: [], weightedDetails: [] };
        let normBuilt = {}, normUnbuilt = {};
        const bUnit = (bObj.unit || bObj.单位 || '').toLowerCase();
        const uUnit = (uObj.unit || uObj.单位 || '').toLowerCase();
        const inchUnits = ['inch', 'inches', 'in', '英寸', '"', '″'];
        const bIsInch = inchUnits.some(u => bUnit.includes(u));
        const uIsInch = inchUnits.some(u => uUnit.includes(u));
        const bConvert = bIsInch ? 2.54 : 1;
        const uConvert = uIsInch ? 2.54 : 1;
        
        for (let key in bObj) {
            const normKey = dimensionMap[key.toLowerCase()] || key;
            if (normKey === 'unit' || normKey === '单位') continue;
            let val = bObj[key];
            if (typeof val === 'number') val *= bConvert;
            else if (typeof val === 'string') { const cm = convertToCm(val); val = (cm !== null) ? cm : null; }
            if (val !== null && val > 0) normBuilt[normKey] = val;
        }
        for (let key in uObj) {
            const normKey = dimensionMap[key.toLowerCase()] || key;
            if (normKey === 'unit' || normKey === '单位') continue;
            let val = uObj[key];
            if (typeof val === 'number') val *= uConvert;
            else if (typeof val === 'string') { const cm = convertToCm(val); val = (cm !== null) ? cm : null; }
            if (val !== null && val > 0) normUnbuilt[normKey] = val;
        }
        const builtKeys = Object.keys(normBuilt), unbuiltKeys = Object.keys(normUnbuilt);
        if (builtKeys.length === 1 && unbuiltKeys.length > 1) {
            const singleKey = builtKeys[0];
            const bestKey = unbuiltKeys.find(k => k === singleKey) || unbuiltKeys.find(k => k.includes(singleKey) || singleKey.includes(k)) || (unbuiltKeys.includes('length') ? 'length' : unbuiltKeys[0]);
            normUnbuilt = { [bestKey]: normUnbuilt[bestKey] };
        }
        if (unbuiltKeys.length === 1 && builtKeys.length > 1) {
            const singleKey = unbuiltKeys[0];
            const bestKey = builtKeys.find(k => k === singleKey) || builtKeys.find(k => k.includes(singleKey) || singleKey.includes(k)) || (builtKeys.includes('length') ? 'length' : builtKeys[0]);
            normBuilt = { [bestKey]: normBuilt[bestKey] };
        }
        const allKeys = new Set([...Object.keys(normBuilt), ...Object.keys(normUnbuilt)]);
        let totalWeight = 0, weightedDiffSum = 0;
        let hasValidDim = false;
        const details = [], weightedDetails = [];
        for (let key of allKeys) {
            const bVal = normBuilt[key], uVal = normUnbuilt[key];
            if (bVal === undefined || uVal === undefined || bVal === 0) continue;
            hasValidDim = true;
            const diffCm = Math.abs(uVal - bVal);
            const diffPercent = diffCm / bVal * 100;
            details.push({ key, built: bVal, unbuilt: uVal, diffCm, diffPercent });
            totalWeight += bVal;
            weightedDiffSum += diffPercent * bVal;
            weightedDetails.push({ key, built: bVal, unbuilt: uVal, diffPercent, weight: bVal });
        }
        if (!hasValidDim) return { diff: null, reason: '未识别', details: [], weightedDetails: [] };
        const weightedAvgDiff = totalWeight > 0 ? weightedDiffSum / totalWeight : 0;
        let allDimsBelowThreshold = true;
        for (let d of details) { if (d.diffCm >= 4) { allDimsBelowThreshold = false; break; } }
        if (weightedAvgDiff < 4 && allDimsBelowThreshold) return { diff: null, reason: '微小', details, weightedDetails };
        return { diff: weightedAvgDiff, reason: null, details, weightedDetails };
    }

    const materialCategories = { '金属':['铁','铜','不锈钢','铝','钢','金属','合金','锌合金'], '木材':['木','木质','竹','实木','密度板'], '塑料':['塑料','PP','PVC','ABS','亚克力','树脂','硅胶','橡胶'], '玻璃':['玻璃','钢化玻璃','水晶'], '陶瓷':['陶瓷','瓷','陶','炻器'], '布艺':['布','棉','绒','麻','毛毡'], '纸类':['纸','卡纸','牛皮纸'], '其他':[] };
    function getMaterialCategory(m) { const s = safeString(m); if(!s) return '未知'; for(let [cat,kws] of Object.entries(materialCategories)) if(kws.some(kw=>s.includes(kw))) return cat; return '其他'; }

    function mapCompetitionLevel(level) {
        if (!level) return '未判断';
        const lvl = String(level).trim();
        if (/^[1-5]$/.test(lvl) || lvl.includes('级')) { const num = parseInt(lvl.replace(/[^0-9]/g, '')) || 0; if (num === 1) return '高度竞争'; if (num === 2) return '较高竞争'; if (num === 3) return '一般竞争'; if (num === 4) return '较低竞争'; if (num === 5) return '无竞争'; return '未判断'; }
        if (lvl.includes('高度')) return '高度竞争';
        if (lvl.includes('较高')) return '较高竞争';
        if (lvl.includes('一般')) return '一般竞争';
        if (lvl.includes('较低')) return '较低竞争';
        if (lvl.includes('无竞争')) return '无竞争';
        return lvl;
    }

    function normalizeCompetitionByAnalysis(level, analysis, submarketAnalysis) {

        const strongCompetitionSignals = [

            '核心结构均', '核心结构一致', '核心结构相同',
            '使用场景完全重合', '使用场景重合', '目标用户重叠度较高', '目标用户重叠',
            '消费者需求完全相同', '同一决策区间', '纳入同一决策区间',
            '核心需求场景无本质区别', '核心需求无本质区别'

            '目标用户不同', '使用场景不同', '核心功能不同', '用途不同'

        const hasStrong = strongCompetitionSignals.some(kw => text.includes(kw));
        const hasMedium = mediumCompetitionSignals.some(kw => text.includes(kw));
        const hasWeak = weakCompetitionSignals.some(kw => text.includes(kw));
        let adjusted = compLevel, reason = '';
        if ((compLevel === '较低竞争' || compLevel === '无竞争') && hasStrong) {
            adjusted = '较高竞争';

    function isInProtection(buildDate, productType) { if (!buildDate) return true; const now = new Date(), build = new Date(buildDate); const months = (now.getFullYear() - build.getFullYear()) * 12 + (now.getMonth() - build.getMonth()); const prot = productType === 'seasonal' ? 12 : 9; return months < prot; }

    function hasMajorMaterialDiff(res) {

    function evaluateInProtectionPioneerRule({ res, builtComps, unbuiltComps, combined, qDiff, sizeDiff, appearDiff, compLevel, submarketLevel, isLowCompetition }) {
        const isMultiComponent = (builtComps && builtComps.length > 1) || (unbuiltComps && unbuiltComps.length > 1);
        const materialMajor = hasMajorMaterialDiff(res);
        const sizeExtreme = sizeDiff !== null && !isNaN(sizeDiff) && sizeDiff >= 50;
        const quantityChanged = qDiff !== null && !isNaN(qDiff) && qDiff > 0;
        const sizeChanged = sizeDiff !== null && !isNaN(sizeDiff) && sizeDiff > 0;
        const onlyProtectedExpansion = appearDiff < 50 && !materialMajor && (quantityChanged || sizeChanged);

        if (appearDiff < 50 && !materialMajor) {
            return {
                decided: true,
                pass: false,
                reason: '保护期内首创对比以产品款式/外形特征为核心：款式外形差异不足50%，且不存在材质大类差异，不通过。'
            };
        }

        if (isMultiComponent) {
            return {
                decided: true,
                pass: combined >= 50,
                reason: combined >= 50
                    ? `保护期内组合产品不按单品数量/尺寸拓展限制处理，综合差异度${formatPercent(Math.round(combined))}≥50%，通过。`
                    : `保护期内组合产品不按保护期直接限制，但综合差异度${formatPercent(Math.round(combined))}<50%，不通过。`
            };
        }
        if (materialMajor) {
            return { decided: true, pass: true, reason: '保护期内存在材质大类差异，可能影响产品用途，不按单纯保护期拓展处理，通过。' };
        }
        if (sizeExtreme) {
            return { decided: true, pass: true, reason: `保护期内尺寸/容量差异达到${formatPercent(sizeDiff)}，可能影响产品用途，按用途差异处理，通过。` };
        }
        if (onlyProtectedExpansion) {
            return {
                decided: true,
                pass: false,
                reason: '保护期内仅属于数量、尺寸方向的拓展，且图案/款式差异不足50%，不通过。'
            };
        }
        const pass = appearDiff >= 50 || isLowCompetition || (submarketLevel === '较大' && compLevel !== '较高竞争' && compLevel !== '高度竞争');
        return {

            pass,
            reason: pass

                : `保护期内图案差异度<50%，且未形成低竞争或明显细分差异，不通过。`
        };

    function evaluateOutOfProtectionRule(res, builtComps, unbuiltComps, builtHasPrimary, unbuiltHasPrimary, isClothing = false) {
        const appearDiff = res.overall_percent || 0;
        const qDiff = Math.abs((parseFloat(res.unbuilt_quantity)||0) - (parseFloat(res.built_quantity)||0)) / (parseFloat(res.built_quantity)||1) * 100;
        const sizeResult = calcSizeDiffStructured(res.built_size, res.unbuilt_size);
        const sizeDiff = isClothing ? null : sizeResult.diff;
        const materialDiff = hasMajorMaterialDiff(res) ? 100 : 0;
        const isMultiComponent = (builtComps && builtComps.length > 1) || (unbuiltComps && unbuiltComps.length > 1);
        const overlapRatio = res.component_overlap_ratio || 0;
        if (appearDiff < 50 && materialDiff === 0) {
            return { pass: false, reason: '首创对比以产品款式/外形特征为核心：款式外形差异不足50%，且不存在材质大类差异，不通过。' };
        }
        if (!isMultiComponent) {
            const dims = []; if (qDiff>0) dims.push({name:'数量',diff:qDiff}); if (sizeDiff&&sizeDiff>0) dims.push({name:'尺寸',diff:sizeDiff}); if (materialDiff>0) dims.push({name:'材质大类',diff:materialDiff}); if (appearDiff>0) dims.push({name:'图案',diff:appearDiff});
            const significantDims = dims.filter(d=>d.diff>=50);
            if (significantDims.length>=1 && dims.length>=2) return {pass:true, reason:`满足2个维度差异且其中一个维度≥50% (${significantDims.map(d=>d.name).join('、')})`};
            if (dims.some(d=>d.diff>=50)) return {pass:true, reason:`与已建产品对比满足某一维度差异≥50%`};
            return {pass:false, reason:`单品单维度不满足条件`};
        }
        const dims = [appearDiff,qDiff,sizeDiff,materialDiff].filter(v=>!isNaN(v)&&v>0);
        const maxDim = Math.max(...dims,0), sumDim = dims.reduce((a,b)=>a+b,0);
        const hasAny50 = dims.some(d=>d>=50), allBelow50 = dims.every(d=>d<50);

        let expandedId = null;
        const exist = document.querySelector('.record-detail[style*="display: block"]');
        if (exist) { const item = exist.closest('.record-item'); if (item) expandedId = item.getAttribute('data-id'); }
        const cont = document.getElementById('recordsList');
        if (!cont) return;
        let filtered = [...historyRecords];
        if (searchTerm.trim()) {
            const t = searchTerm.trim().toLowerCase();
            filtered = filtered.filter(r => r.newProductId && r.newProductId.toLowerCase().includes(t));
        }
        if (filtered.length === 0) { cont.innerHTML = '<p style="text-align:center;color:#64748b;">暂无记录</p>'; return; }
        let html = '';
        filtered.forEach(rec => {
            const statText = rec.status === 'analyzing' ? 'AI分析中...' : (rec.isPass ? '通过' : '不通过');
            const statClass = rec.status === 'analyzing' ? 'analyzing' : (rec.isPass ? 'pass' : 'fail');
            const uPriceDisp = rec.unbuiltPrice ? `$${parseFloat(rec.unbuiltPrice).toFixed(2)}` : '未填';
            const bPricesDisp = (rec.builtConfigs || []).map(c => c.price ? `$${parseFloat(c.price).toFixed(2)}` : '未填').join(', ');
            if (rec.summaryHtml) {
                html += `<div class="record-item" data-id="${rec.id}">${rec.summaryHtml}${rec.status === 'failed' ? `<div style="text-align:right;"><button class="retry-btn" data-id="${rec.id}">重新分析</button></div>` : ''}</div>`;
            } else {
                const prodName = rec.productName || (rec.status === 'analyzing' ? '分析中...' : (rec.isPass ? '通过' : '不通过'));
                html += `<div class="record-item" data-id="${rec.id}"><div class="record-summary"><div class="record-info"><div class="image-row"><div class="thumb"><img src="${rec.unbuiltThumb || ''}"></div><span class="vs">VS</span>${(rec.builtThumbs || []).map(t => `<div class="thumb"><img src="${t}"></div>`).join('')}</div><div class="record-desc">新品ID: ${rec.newProductId || '未填'}<br>产品名称: ${prodName}</div></div><div class="price-display">💰 未建: ${uPriceDisp} &nbsp;|&nbsp; 已建: ${bPricesDisp}</div><div class="record-status ${statClass}">${statText}</div>${rec.status === 'failed' ? `<button class="retry-btn" data-id="${rec.id}">重新分析</button>` : ''}<span class="toggle-icon">▼</span></div><div class="record-detail" style="display:none;"></div></div>`;
            }
        });
        cont.innerHTML = html;
        cont.querySelectorAll('.record-item').forEach(item => {
            const sum = item.querySelector('.record-summary'), det = item.querySelector('.record-detail');
            if (sum && det) sum.addEventListener('click', e => {
                if (e.target.classList.contains('retry-btn')) return;
                const hidden = det.style.display === 'none';
                det.style.display = hidden ? 'block' : 'none';
                const icon = sum.querySelector('.toggle-icon');
                if (icon) icon.textContent = hidden ? '▲' : '▼';
            });
            item.querySelectorAll('.qty-input').forEach(input => {
                input.addEventListener('click', e => e.stopPropagation());
                input.addEventListener('input', e => {
                    e.stopPropagation();
                    recalcManualQuantityDiff(input.closest('.comparison-result'));
                });
            });
            item.querySelectorAll('.size-input').forEach(input => {
                input.addEventListener('click', e => e.stopPropagation());
                input.addEventListener('input', e => {
                    e.stopPropagation();
                    recalcManualQuantityDiff(input.closest('.comparison-result'));
                });
            });
            const retry = item.querySelector('.retry-btn');
            if (retry) retry.addEventListener('click', async e => {
                e.stopPropagation();
                const id = retry.dataset.id;
                const rec = historyRecords.find(r => r.id === id);
                if (rec) await retryAnalysis(rec);
            });
        });
        if (expandedId) {
            const tgt = cont.querySelector(`.record-item[data-id="${expandedId}"]`);
            if (tgt) {
                const det = tgt.querySelector('.record-detail'), sum = tgt.querySelector('.record-summary');
                if (det && sum && det.style.display !== 'block') {
                    det.style.display = 'block';
                    const icon = sum.querySelector('.toggle-icon');
                    if (icon) icon.textContent = '▲';
                }
            }
        }
    }
    // ---------- 启动 ----------
    initUnbuilt(); for (let i = 1; i <= 1; i++) builtItems[`built_${i}`] = { imageDataUrl: null, compressedBase64: null, text: '', price: '', compareType: 'non_pioneer', buildDate: '', productType: 'regular' }; rebuildBuiltItems(1);
    builtCountSelect.addEventListener('change', () => { rebuildBuiltItems(parseInt(builtCountSelect.value)); });
    document.getElementById('compareBtn').onclick = async function() {
        if (!unbuilt.imageDataUrl) { alert('请上传未建产品图片'); return; }
        const anyBuilt = Object.keys(builtItems).some(k => builtItems[k].imageDataUrl);
        if (!anyBuilt) { alert('请至少上传一个已建图片'); return; }
        const uImg = unbuilt.imageDataUrl, uTxt = unbuilt.text, uPrice = unbuilt.price, uThumb = unbuilt.compressedBase64 || '', newId = unbuilt.newProductId;
        const builtData = Object.keys(builtItems).map(k => ({ imageData: builtItems[k].imageDataUrl, text: builtItems[k].text, price: builtItems[k].price, compareType: builtItems[k].compareType, buildDate: builtItems[k].buildDate, productType: builtItems[k].productType }));
        const bThumbs = Object.keys(builtItems).map(k => builtItems[k].compressedBase64 || '');
        clearComparisonGroup();
        const recId = Date.now() + '_' + Math.random();
        const tmp = { id: recId, newProductId: newId, timestamp: new Date().toLocaleString(), status: 'analyzing', summaryHtml: '', detailHtml: '', isPass: false, combinedDiff: 0, unbuiltThumb: uThumb, builtThumbs: bThumbs, unbuiltDesc: uTxt, unbuiltPrice: uPrice, builtConfigs: builtData.map(b => ({ text: b.text, price: b.price, compareType: b.compareType, buildDate: b.buildDate, productType: b.productType })), productName: '', unbuiltImageData: uImg, builtImagesData: builtData.map(b => b.imageData) };
        await addRecord(tmp);
        (async () => {
            try {
                const cfg = { unbuiltImageData: uImg, unbuiltText: uTxt, unbuiltPrice: uPrice, newProductId: newId, unbuiltThumb: uThumb, builtThumbs: bThumbs, builtItemsData: builtData };
                const r = await analyzeWithConfig(cfg);
                await updateRecord(recId, { status: 'done', summaryHtml: r.summaryHtml, detailHtml: r.detailHtml, isPass: r.isPass, combinedDiff: r.combinedDiff, productName: r.productName });
            } catch (e) {
                console.error(e);
                await updateRecord(recId, { status: 'failed', summaryHtml: `<div class="record-summary">分析失败: ${e.message}</div>`, detailHtml: '', isPass: false, combinedDiff: 0, productName: '分析失败' });
            }
        })();
    };
    const searchInp = document.getElementById('historySearchInput'), searchBtn = document.getElementById('historySearchBtn'), resetBtn = document.getElementById('historyResetBtn'), clearBtn = document.getElementById('clearHistoryBtn');
    searchBtn.addEventListener('click', () => renderRecordsList(searchInp.value));
    resetBtn.addEventListener('click', () => { searchInp.value = ''; renderRecordsList(''); });
    clearBtn.addEventListener('click', async () => { if (confirm('确定清空所有记录？')) await clearHistory(); });
    searchInp.addEventListener('keypress', e => { if (e.key === 'Enter') renderRecordsList(searchInp.value); });
    const qaBtn = document.getElementById('qaAskBtn'), qaQ = document.getElementById('qaQuestion'), qaA = document.getElementById('qaAnswer');
    qaBtn.addEventListener('click', async () => {
        const q = qaQ.value.trim();
        if (!q) { alert('请输入问题'); return; }
        qaA.style.display = 'block'; qaA.innerHTML = '🤔 思考中...'; qaA.classList.add('loading');
        try { const a = await askQuestion(q); qaA.innerHTML = a; qaA.classList.remove('loading'); }
        catch (e) { qaA.innerHTML = `回答失败：${e.message}`; qaA.classList.remove('loading'); }
    });
    qaQ.addEventListener('keypress', e => { if (e.key === 'Enter') qaBtn.click(); });
    loadHistory().catch(console.error);
})();
</script>
</body>
</html>
